<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your group — I’m In Golf preview</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#193b27;background:#f4f7f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:0 auto;padding:24px 22px 48px}header{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800;margin:16px 0 28px}header img{border-radius:14px}.banner{background:#fff2cc;color:#674c12;font-size:13px;line-height:1.5;padding:13px 16px;border-radius:12px;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.4px;color:#447050}h1{font-size:38px;line-height:1.08;letter-spacing:-1.2px;margin:14px 0}p{line-height:1.6;color:#57655a}section{background:white;border:1px solid #dce5d8;border-radius:24px;padding:26px;box-shadow:0 10px 40px #193b270a}label{display:block;font-size:15px;font-weight:700;margin-top:22px}input{width:100%;font:inherit;padding:15px;border:1px solid #b8cbbd;border-radius:11px;margin-top:8px;color:#193b27;background:white;min-width:0}small{display:block;color:#627065;font-size:13px;line-height:1.5;margin-top:7px}button,.button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:15px 18px;display:block;text-align:center;text-decoration:none;width:100%;margin-top:13px;background:#176b3a;color:white;font-weight:750}.secondary{background:#eef5e9;color:#176b3a}.back{background:transparent;color:#56635a;text-align:left;width:auto;padding-left:0;margin:0;font-size:14px}.progress{display:flex;gap:6px;margin-bottom:25px}.progress span{height:4px;border-radius:8px;flex:1;background:#dde6d9}.progress .done{background:#176b3a}.note{padding:14px;background:#f1f6ec;border-radius:12px;font-size:14px;line-height:1.6;margin-top:20px}.pin{font-size:38px;font-weight:850;letter-spacing:7px;text-align:center;padding:20px;background:#eff5e9;border-radius:16px;margin:20px 0}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400;font-size:13px;line-height:1.6}.check input{width:20px;margin:2px 0;flex-shrink:0}.summary{display:grid;gap:14px;margin:24px 0}.summary div{border-bottom:1px solid #e3e9df;padding-bottom:12px}.summary dt{font-size:12px;color:#627065}.summary dd{margin:5px 0 0;overflow-wrap:anywhere;font-weight:700}.error{color:#a22f25;font-size:14px}footer{text-align:center;font-size:13px;color:#627065;margin-top:24px}a{color:#176b3a}textarea{width:100%;min-height:170px;font:inherit;font-size:14px;padding:12px;border:1px solid #b8cbbd;border-radius:10px;resize:vertical} :focus-visible{outline:3px solid #a67c00;outline-offset:3px}@media(max-width:380px){section{padding:20px}h1{font-size:32px}main{padding:18px 16px}}
</style></head><body><main><header><img src="icon-192.png" width="54" height="54" alt=""><span>I’m In Golf</span></header><div class="banner"><b>Try the new setup — design preview</b><br>No account, group or invitation is created. Use made-up details. Email verification is simulated.</div><div class="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div><section id="panel"></section><footer>One final score. More time for golf.<br><a href="./">Back to the welcome screen</a></footer></main><script>
'use strict';
const draft={group:'',name:'',email:''};let step=0;
const panel=document.getElementById('panel');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(n){step=n;document.querySelectorAll('.progress span').forEach((el,i)=>el.classList.toggle('done',i<=n));render();const h=panel.querySelector('h1');h.tabIndex=-1;h.focus();window.scrollTo(0,0)}
function intro(k,title,description){return `<span class="eyebrow">${k}</span><h1>${title}</h1><p>${description}</p>`}
function render(){
if(step===0){panel.innerHTML=intro('1 OF 4 · YOUR GROUP','Good golf starts here.','Give your group a name. You can change it later.')+`<form id="details"><label for="group">Group name</label><input id="group" name="group" required maxlength="60" autocomplete="off" placeholder="e.g. Saturday Golfers" value="${esc(draft.group)}"><small>Something your friends will recognise.</small><div class="note"><b>You’ll be the group organiser.</b><br>Set up competitions, invite your golfers and keep everyone together.</div><button>Continue →</button></form>`;
panel.querySelector('form').onsubmit=e=>{e.preventDefault();let input=document.getElementById('group');draft.group=input.value.trim();if(!draft.group){input.setCustomValidity('Give your group a name.');input.reportValidity();return}show(1)};
document.getElementById('group').oninput=e=>e.target.setCustomValidity('');
}else if(step===1){panel.innerHTML=`<button class="back" data-back>← Group name</button>`+intro('2 OF 4 · ABOUT YOU','You’re the organiser.','Your email will help you get back into your group when you change phones.')+`<form><label for="name">Your name</label><input id="name" autocomplete="name" required maxlength="80" value="${esc(draft.name)}" placeholder="e.g. Alex Taylor"><label for="email">Your email</label><input id="email" type="email" autocomplete="email" required maxlength="254" value="${esc(draft.email)}" placeholder="alex@example.com"><small>In the finished app, we’ll verify this address before creating your group.</small><button>Continue to email check →</button></form>`;
panel.querySelector('form').onsubmit=e=>{e.preventDefault();const name=document.getElementById('name');draft.name=name.value.trim();draft.email=document.getElementById('email').value.trim();if(!draft.name){name.setCustomValidity('Enter your name.');name.reportValidity();return}show(2)};document.getElementById('name').oninput=e=>e.target.setCustomValidity('');
}else if(step===2){panel.innerHTML=`<button class="back" data-back>← Change your details</button>`+intro('3 OF 4 · EMAIL CHECK','A little reassurance.','Only the person with access to your email should be able to finish setting up your group.')+`<div class="note">Verification address<br><b>${esc(draft.email)}</b></div><p>For this preview, continue below to see what happens after a successful email check.</p><button id="verify">Simulate successful verification →</button><small>No email will be sent.</small>`;document.getElementById('verify').onclick=()=>show(3);
}else if(step===3){panel.innerHTML=`<button class="back" data-back>← Back</button>`+intro('4 OF 4 · READY TO GO','Your group, your golfers.','Check the details before trying the next screen.')+`<dl class="summary"><div><dt>Group</dt><dd>${esc(draft.group)}</dd></div><div><dt>Organiser</dt><dd>${esc(draft.name)}</dd></div><div><dt>Email</dt><dd>${esc(draft.email)}</dd></div></dl><div class="note">The finished setup will show the available plan and its limits here before you create a group.</div><button id="finish">Preview my ready screen →</button>`;document.getElementById('finish').onclick=()=>show(4);
}else if(step===4){panel.innerHTML=intro('PREVIEW COMPLETE','Let’s get your mates in.',`This is how <b>${esc(draft.group)}</b> could look once it’s ready.`)+`<small style="text-align:center">Example Group PIN · not a working code</small><div class="pin">DEMO</div><p>Your Group PIN is for players. Your organiser access stays private.</p><button id="invite">Preview player invitation →</button><button class="secondary" id="round">Plan the first competition →</button><button class="back" id="restart">Start preview again</button>`;document.getElementById('invite').onclick=()=>show(5);document.getElementById('round').onclick=()=>show(6);document.getElementById('restart').onclick=()=>{draft.group='';draft.name='';draft.email='';show(0)};
}else if(step===5){panel.innerHTML=`<button class="back" id="ready">← Back to your group</button>`+intro('INVITE YOUR GOLFERS','Golf is better together.','The finished app will let you share this through WhatsApp or copy it into a message.')+`<textarea readonly aria-label="Example player invitation">${esc(`DESIGN PREVIEW — NOT A LIVE INVITATION\n\nJoin ${draft.group} on I’m In Golf.\n\nSee who’s playing, enter your final score and follow our results.\n\nYour real Group PIN and join link will appear here.`)}</textarea><small>Only player access belongs in this message. Never include organiser credentials.</small>`;document.getElementById('ready').onclick=()=>show(4);
}else{panel.innerHTML=`<button class="back" id="ready">← Back to your group</button>`+intro('YOUR FIRST COMPETITION','Something to look forward to.','In the finished app, this will open competition setup for your new group.')+`<ol><li><p>Choose the course and date.</p></li><li><p>Select Stableford or Net scoring.</p></li><li><p>Open the competition for your golfers.</p></li></ol><div class="note">You can invite people first and organise the round later. Nobody needs to enter hole-by-hole scores.</div><button id="later">I’ll organise it later</button>`;document.getElementById('ready').onclick=()=>show(4);document.getElementById('later').onclick=()=>show(4)}
const back=panel.querySelector('[data-back]');if(back)back.onclick=()=>show(step-1);
}
render();
</script></body></html>
