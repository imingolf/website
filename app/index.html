<!doctype html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I'm In Golf</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17231b;--muted:#68736c;--green:#176b3a;--green2:#23864e;--line:#dce3dd;--amber:#8a6500;--amberbg:#fff1c7;--red:#a83b34;--redbg:#fbe4e1}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:76px}
header{background:linear-gradient(135deg,#10592f,#23864e);color:white;padding:calc(24px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:30px} header p{margin:5px 0 0;opacity:.85}
main{padding:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
h2{font-size:18px;margin:0 0 12px}.muted{font-size:13px;color:var(--muted)}.big{font-size:28px;font-weight:800}
.pill{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px}.paid{background:#def4e5;color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.danger{background:var(--redbg);color:var(--red)}
.player{padding:12px 0;border-top:1px solid var(--line)}.player:first-child{border-top:0}
button{border:0;border-radius:12px;padding:11px 13px;font-weight:750;font-size:14px}.primary{background:var(--green);color:white}.secondary{background:#edf4ef;color:var(--green)}.ghost{background:#f3f4f3;color:#536058}.red{background:var(--redbg);color:var(--red)}
.full{width:100%;margin-top:10px}.small{padding:8px 10px;font-size:12px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:white;margin:5px 0 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#edf5ef;padding:11px;border-radius:12px;font-size:13px;margin:10px 0}.warning{background:#fff5dc}
.comp-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}.comp-choice button{border:2px solid var(--line);background:#f3f4f3;color:#536058;padding:14px 8px;font-size:15px}.comp-choice button.selected{background:var(--green);border-color:var(--green);color:white}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line);display:flex;z-index:20}
nav button{flex:1;background:transparent;color:#6d756f;padding:11px 2px;font-size:13px;line-height:1.35}nav button.active{color:var(--green);font-weight:800}
.pay-sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:white;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 6px 22px rgba(0,0,0,.14);z-index:19}
.pay-sticky .full{margin-top:0}.pay-screen-spacer{height:82px}
.finish-sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:white;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 6px 22px rgba(0,0,0,.14);z-index:19}.finish-sticky .full{margin-top:0}.finish-screen-spacer{height:82px}
.advanced-controls{margin-top:12px}.advanced-controls summary{cursor:pointer;list-style:none;background:#fce2df;color:var(--red);border-radius:12px;padding:14px;text-align:center;font-weight:800}.advanced-controls summary::-webkit-details-marker{display:none}.advanced-controls[open] summary{margin-bottom:10px}.advanced-controls .red{margin-top:8px}
.app-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 40px));background:#edf5ef;color:var(--green);border:1px solid #d7eadc;border-radius:16px;padding:13px 16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:10020;opacity:0;transition:opacity .18s ease,transform .18s ease}.app-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}.app-toast b{display:block;font-size:15px}.app-toast span{display:block;font-size:13px;margin-top:3px;color:#51655a}
.score{width:78px;margin:0}.pos{font-weight:800;font-size:18px;min-width:24px}.money{font-weight:800}
#setupOverlay{position:fixed;inset:0;background:#f4f6f3;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:45px 16px;overflow:auto}
.setup{width:min(480px,100%)}.hidden{display:none!important}


/* Opening animation: self-contained and isolated from the app */
#openingSplash{position:fixed;inset:0;z-index:20000;background:#bfe4ff;display:flex;align-items:stretch;justify-content:stretch;opacity:1;transition:opacity .28s ease;pointer-events:none;overflow:hidden}
#openingSplash.hide{opacity:0}
#openingSplash .opening-stage{position:relative;width:100%;height:100%;background:linear-gradient(#bfe4ff 0 58%,#76b96a 58% 100%);overflow:hidden}
#openingSplash svg{width:100%;height:100%;display:block}
#openingSplash .opening-brand{font-weight:900;fill:#0f5a37;font-size:54px;opacity:0}
@media (max-width:600px) and (orientation:portrait){#openingSplash .opening-brand{font-size:64px}}
@media (prefers-reduced-motion:reduce){#openingSplash{transition:none}}


/* Mobile polish pass — presentation only; app logic and opening animation remain unchanged */
button{
  min-height:44px;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.small{min-height:40px}
@media (max-width:600px){
  .muted{font-size:14px;line-height:1.4}
  .notice{font-size:14px;line-height:1.4}
  .pill{font-size:13px}
  nav button{min-height:48px}
  .pay-sticky,.finish-sticky{bottom:calc(76px + env(safe-area-inset-bottom))}
  .pay-screen-spacer,.finish-screen-spacer{height:88px}
  #setupOverlay{
    padding-top:calc(22px + env(safe-area-inset-top));
    padding-bottom:calc(22px + env(safe-area-inset-bottom));
  }
}
@media (max-width:350px){
  .grid2{grid-template-columns:1fr}
  main{padding-left:10px;padding-right:10px}
  .card{padding:14px}
}
@media (max-height:650px){
  #setupOverlay{padding-top:12px;padding-bottom:12px}
}

</style>
</head>
<body>

<div id="openingSplash" aria-hidden="true">
  <div class="opening-stage">

          <stop offset="0%" stop-color="#6fba68"/>
          <stop offset="100%" stop-color="#58a155"/>
        </linearGradient>
        <filter id="iigOpeningBallShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".25"/>

      </defs>
      <ellipse cx="500" cy="690" rx="620" ry="255" fill="url(#iigOpeningGreenShade)"/>
      <path id="iigOpeningFlightPath" d="M 135 525 C 290 265, 500 225, 675 335 C 770 395, 815 475, 825 570" fill="none" stroke="none"/>
      <ellipse cx="825" cy="570" rx="22" ry="8" fill="#23372c"/>
      <line x1="825" y1="570" x2="825" y2="405" stroke="#f7f7f7" stroke-width="5" stroke-linecap="round"/>
      <path d="M 825 405 L 900 430 L 825 455 Z" fill="#0f5a37"/>
      <g id="iigOpeningBall" filter="url(#iigOpeningBallShadow)">
        <circle cx="135" cy="525" r="15" fill="#fff"/>
        <circle cx="130" cy="520" r="2" fill="#d7ddd8"/>
        <circle cx="141" cy="519" r="2" fill="#d7ddd8"/>
        <circle cx="136" cy="530" r="2" fill="#d7ddd8"/>
      </g>
      <text id="iigOpeningBrand" class="opening-brand" x="500" y="105" text-anchor="middle">I’m In Golf ⛳</text>
    </svg>
  </div>
</div>

      ball.setAttribute('transform',`translate(${825-start.x} ${570-start.y+y})`);

      if(s<1){requestAnimationFrame(sink);return;}
      ball.style.opacity='0';
      if(brand)brand.animate([{opacity:0},{opacity:1}],{duration:350,fill:'forwards'});
      closeSplash(620);
    }
    requestAnimationFrame(sink);
  }
  requestAnimationFrame(frame);
})();
</script>

async function save(){

  if(!db)return;

  if(demoReadOnly()){
    $("syncText").textContent="Demo • read only";

  $("syncText").textContent="Saving…";

  // Persist meaningful group activity for the Owner Dashboard.

  const {data,error}=await db.rpc(
    "save_group_state",
    {p_pin:pin,p_state:state}
  );

  $("syncText").textContent=
    error ? "Couldn't sync" : "Shared • synced";

  return !error;
}
async function refresh(){
 if(!db)return;

 // Never redraw while someone is typing a score draft.
 // This prevents the 5-second sync from wiping or replacing an unsent score.
 if(scoreDraftActive)return;

 // Keep Owner utility screens on display.
 // Do not let the 5-second background sync redraw them while they are open.
 if(page==="settings" || page==="admininvite" || page==="managegroups" || page==="editgroup" || page==="adminhelp")return;

 const editing=document.activeElement &&
   document.activeElement.tagName==="INPUT";

 if(editing)return;

 const {data,error}=await db.rpc("get_group_state",{p_pin:pin});
if(!error && data){
  state=data;
  ensureDemoMoneyHistory();

  // Only redraw the app if this phone's saved player still exists
  // in the current group. This prevents "Find my name" from being
  // replaced by the join screen every 5 seconds when a stale player
  // ID is stored from another group.
  const currentPlayerExists=
    myPlayerId && state.players.some(p=>p.id===myPlayerId);

  if(currentPlayerExists){
    render();
  }

  $("syncText").textContent=
  demoReadOnly() ? "Demo • read only" : "Shared • synced";
}

 }

function roundLocked(){
  return state.players.some(p=>
    p.stableford!=null ||
    p.netScore!=null ||
    p.noReturn===true
  );
}

function roundOpenNow(){
  if(state.roundOpen===false)return false;
  if(state.roundOpen===true)return true;

  // Backward-compatible check for groups that completed a round before
  // the roundOpen flag existed. If the latest saved round matches the
  // current round and all entries have already been reset, treat it as closed.
  const last=(state.history||[])[0];
  const noLiveEntries=(state.players||[]).every(p=>
    !p.paid &&
    p.stableford==null &&
    p.netScore==null &&
    p.noReturn!==true
  );

  if(last && noLiveEntries){
    const sameCourse=String(last.course||"")===String(state.course||"");
    const sameDate=String(last.date||"")===String(state.date||"");
    if(sameCourse && sameDate)return false;
  }

  return true;
}

function waitingForNextCompetition(){
  return !state.trip?.active && !roundOpenNow();
}

function firstRoundNotYetCreated(){
  return !state.trip?.active &&
    (state.history||[]).length===0 &&
    !String(state.course||"").trim() &&
    !String(state.date||"").trim() &&
    !roundOpenNow();
}

  if(!course){ alert("Please enter the course."); $("firstRoundCourse")?.focus(); return; }
  if(!date){ alert("Please choose the date."); $("firstRoundDate")?.focus(); return; }
  if(!Number.isFinite(stake) || stake<0){ alert("Please enter a valid stake, or leave it blank for no money game."); return; }
  if(stake>0 && !String(state.paymentLink||"").trim()){
    alert("Please add your payment link in Admin / Settings before starting a money round.");
    return;
  }

  state.course=course;
  state.date=date;
  state.stake=stake;
  state.gameType="money";
  state.pointsCompetition=competition==="net" ? "net" : "stableford";
  state.roundOpen=true;
  state.players.forEach(p=>{
    p.paid=false; p.competition=null; p.stableford=null; p.netScore=null;
    p.noReturn=false; p.scoreSubmitted=false;
  });
  await save();
  render();
}

function paidCount(){return state.players.filter(p=>p.paid).length}
function potentialPot(){return Number(state.stake||0)*state.players.length}
function pot(){return Number(state.stake||0)*paidCount()}
function stablefordPaidCount(){
  return (state.pointsCompetition || "stableford")==="stableford"
    ? state.players.filter(p=>p.paid).length
    : 0;
}

function netPaidCount(){
  return (state.pointsCompetition || "stableford")==="net"
    ? state.players.filter(p=>p.paid).length
    : 0;
}

function stablefordPot(){
  return Number(state.stake||0)*stablefordPaidCount();
}

function netPot(){
  return Number(state.stake||0)*netPaidCount();
}
function tripStandingsSorted(){
  const standings=state.trip?.standings || {};
  return Object.entries(standings)
    .map(([name,points])=>({name,points:Number(points||0)}))
    .sort((a,b)=>b.points-a.points || a.name.localeCompare(b.name));
}

function tripRoundWinner(record){
  if(!record)return null;

  if(record.gameType==="points"){
    const first=(record.pointsResults||[])[0];
    if(!first)return null;
    return {
      name:first.name,
      score:record.pointsCompetition==="net"
        ? "Net " + first.score
        : first.score + " pts",
      label:record.pointsCompetition==="net" ? "Net" : "Stableford"
    };
  }

  const comp=state.trip?.competition || "stableford";

  if(comp==="net"){
    const names=record.netWinnerNames||[];
    if(!names.length)return null;
    const p=(record.players||[]).find(x=>x.name===names[0]);
    return {
      name:names.join(" & "),
      score:p?.noReturn===true ? "NR" : (p?.netScore!=null ? "Net "+p.netScore : ""),
      label:"Net"
    };
  }

  const names=record.stablefordWinnerNames||[];
  if(!names.length)return null;
  const p=(record.players||[]).find(x=>x.name===names[0]);
  return {
    name:names.join(" & "),
    score:p?.stableford!=null ? p.stableford+" pts" : "",
    label:"Stableford"
  };
}

  if(!state.trip)return;
  const sorted=tripStandingsSorted();
  state.trip.champion=sorted.length ? sorted[0].name : null;

function paymentLinkForStake(rawLink,stake){
  const link=String(rawLink||"").trim();
  const amount=Number(stake||0);
  if(!link || !Number.isFinite(amount) || amount<=0)return link;

  // Monzo.me supports the requested amount as /username/amount.
  // Keep the Admin's saved link unchanged; build the round-specific link only when a player taps Pay.
  try{
    const candidate=/^https?:\/\//i.test(link) ? link : `https://${link}`;
    const url=new URL(candidate);
    const host=url.hostname.toLowerCase().replace(/^www\./,"");
    if(host==="monzo.me"){
      const parts=url.pathname.split("/").filter(Boolean);
      if(parts.length){
        const username=parts[0];
        url.pathname=`/${username}/${amount.toFixed(2)}`;
        return url.toString();
      }
    }
  }catch(e){}

  // Other payment providers keep using the Admin's saved link as entered.
  return link;
}

  const me=state.players.find(p=>p.id===myPlayerId);
  if(!me)return;
  if(me.paid){alert("You're already marked paid.");return;}
  const savedLink=String(state.paymentLink||"").trim();
  if(!savedLink){alert("Your Group Admin hasn't added a payment link yet.");return;}
  const link=paymentLinkForStake(savedLink,state.stake);
  sessionStorage.setItem(paymentReturnKey(),JSON.stringify({playerId:me.id,startedAt:Date.now()}));
  window.open(link,"_blank");
}

      ${scorePlayers.map(p=>{

async function setCompetition(i,type){
if(!demoCanEdit())return;
  const p=state.players[i];

  if(!isAdmin && p.id!==myPlayerId)return;

  if(state.gameType==="money" && Number(state.stake||0)>0 && !p.paid){
    alert("Pay before choosing Stableford or Net.");
    return;
  }

  if(roundLocked() && !isAdmin){
    alert("🔒 Entries are closed — scoring has started.");
    return;
  }

  if(roundLocked() && isAdmin && (p.scoreSubmitted===true || p.stableford!=null || p.netScore!=null || p.noReturn===true)){
    alert("This player has already submitted. Use Correct score if a change is needed.");
    return;
  }

  p.competition=type;

  render();
  await save();
}
async function submitPlayerScore(i,type){
  if(!demoCanEdit())return;
  type=state.pointsCompetition||type||"stableford";

  const p=state.players[i];
  if(!p)return;
  if(!isAdmin && p.id!==myPlayerId)return;

  if(state.gameType==="money" && Number(state.stake||0)>0 && !p.paid){
    alert("Pay before entering a score.");
    return;
  }

  const input=$("scoreInput_"+i);
  const raw=String(input?.value||"").trim();
  const value=Number(raw);

  if(!raw || !Number.isFinite(value) || value<0){
    alert("Please enter a valid score.");
    return;
  }

  const label=type==="stableford"
    ? "Stableford score " + value + " points"
    : "Net score " + value;

  if(!confirm("Submit " + label + "?\n\nAre you sure?"))return;

  if(type==="stableford"){
    p.stableford=value;
    p.netScore=null;
  }else{
    p.netScore=value;
    p.stableford=null;
  }

  p.noReturn=false;
  p.scoreSubmitted=true;
  scoreDraftActive=false;

  render();
  const saved=await save();
  if(saved && !isAdmin)showBigPlayerMessage("✅ SCORE IN!","You’re all done.",3000);
}

async function submitNoReturn(i){
  if(!demoCanEdit())return;

  const p=state.players[i];
  if(!p)return;
  if(!isAdmin && p.id!==myPlayerId)return;

  const type=state.pointsCompetition||"stableford";

  if(type!=="net"){
    alert("No Return is available for Net competitions.");
    return;
  }

  if(state.gameType==="money" && Number(state.stake||0)>0 && !p.paid){
    alert("Pay before submitting No Return.");

  }

  p.netScore=null;
  p.stableford=null;
  p.noReturn=true;
  p.scoreSubmitted=true;
  scoreDraftActive=false;

  render();
  const saved=await save();
  if(saved && !isAdmin)showBigPlayerMessage("✅ SCORE IN!","NR recorded — you’re all done.",3000);
}

async function adminEditSubmittedScore(i,type){
  if(!isAdmin || !demoCanEdit())return;

  const p=state.players[i];
  if(!p)return;

  const current=p.noReturn===true
    ? "NR"
    : type==="stableford"
    ? String(p.stableford??"")
    : String(p.netScore??"");

  const answer=prompt(
    "Correct " + p.name + "'s submitted " +
    (type==="stableford" ? "Stableford score" : "Net score") +
    (type==="net" ? ".\n\nEnter a number or NR." : "."),
    current
  );

  if(answer===null)return;

  const clean=String(answer).trim().toUpperCase();

  if(type==="net" && clean==="NR"){
    if(!confirm("Change " + p.name + "'s result to NR — No Return?"))return;
    p.netScore=null;
    p.stableford=null;
    p.noReturn=true;
    p.scoreSubmitted=true;
    render();
    await save();
    return;
  }

  const value=Number(clean);
  if(clean==="" || !Number.isFinite(value) || value<0){
    alert("Please enter a valid score" + (type==="net" ? " or NR." : "."));
    return;
  }

  if(!confirm("Change " + p.name + "'s submitted score to " + value + "?"))return;

  if(type==="stableford"){
    p.stableford=value;
    p.netScore=null;
  }else{
    p.netScore=value;
    p.stableford=null;
  }

  p.noReturn=false;
  p.scoreSubmitted=true;

  render();
  await save();
}

async function finishRound(){

  const isPointsGame=state.gameType==="points";
  const pointsComp=state.pointsCompetition || "stableford";
  const isTrip=Boolean(state.trip?.active);

  function chooseCountbackWinner(players,competition,score,position){
    const names=players.map((p,i)=>`${i+1}. ${p.name}`).join("\n");

    const answer=prompt(
      `${competition} tie for ${position} on ${score}.\n\n` +
      `Use your normal scorecard countback and choose the winner.\nNo hole-by-hole entry is needed in the app.\n\n` +
      names +
      `\n\nEnter the player's number.`
    );

    if(answer===null)return null;

    const selected=Number(answer)-1;

    if(selected<0 || selected>=players.length){
      alert("Please choose one of the listed players.");
      return chooseCountbackWinner(
        players,
        competition,
        score,
        position
      );
    }

    return players[selected];
  }

  function chooseMoneyCountbackWinner(players,competition,score){
    return new Promise(resolve=>{
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;";
      overlay.innerHTML=`
        <div class="card" style="width:min(440px,100%);margin:0;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
          <div style="font-size:38px;text-align:center;">🏆</div>
          <h2 style="text-align:center;margin:8px 0;">Choose countback winner</h2>
          <div class="notice" style="margin-top:14px;">
            <b>${esc(competition)} tie — ${esc(String(score))}</b><br>
            Use your normal scorecard countback. No hole-by-hole entry is needed in I'm In Golf.
          </div>
          <div style="margin-top:14px;">
            ${players.map((p,i)=>`
              <button class="primary full" data-winner="${i}" style="margin-top:${i?8:0}px;">
                🏆 ${esc(p.name)}
              </button>
            `).join("")}
          </div>
          <button class="secondary full" id="cancelCountbackWinner" style="margin-top:12px;">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelectorAll("[data-winner]").forEach(btn=>{
        btn.onclick=()=>{
          const winner=players[Number(btn.dataset.winner)];
          overlay.remove();
          resolve(winner || null);
        };
      });
      overlay.querySelector("#cancelCountbackWinner").onclick=()=>{
        overlay.remove();
        resolve(null);
      };
    });
  }

  function resolveMoneyTie(players,competition,score,pot){
    return new Promise(resolve=>{
      const each=players.length ? Number(pot||0)/players.length : 0;
      const money=n=>Number(n||0).toFixed(2).replace(/\.00$/,"" );
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;";
      overlay.innerHTML=`
        <div class="card" style="width:min(440px,100%);margin:0;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
          <div style="font-size:40px;text-align:center;">🤝</div>
          <h2 style="text-align:center;margin:8px 0;">Tied winning score</h2>
          <div class="notice" style="margin-top:14px;">
            <b>${esc(competition)} — ${esc(String(score))}</b><br>
            ${players.map(p=>esc(p.name)).join(" & ")} are tied for 1st.
          </div>
          <p style="font-weight:800;margin:18px 0 8px;">How would you like to settle it?</p>
          <button class="primary full" id="splitTiePot">
            💷 Split the pot — £${money(each)} each
          </button>
          <button class="secondary full" id="countbackTieWinner" style="margin-top:10px;">
            🏆 Choose winner — countback
          </button>
          <button class="ghost full" id="cancelMoneyTie" style="margin-top:10px;">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector("#splitTiePot").onclick=()=>{
        overlay.remove();
        resolve({winners:[...players],countback:false,split:true});
      };

      overlay.querySelector("#countbackTieWinner").onclick=async()=>{
        overlay.remove();
        const winner=await chooseMoneyCountbackWinner(players,competition,score);
        resolve(winner ? {winners:[winner],countback:true,split:false} : null);
      };

      overlay.querySelector("#cancelMoneyTie").onclick=()=>{
        overlay.remove();
        resolve(null);
      };
    });
  }


  // =====================================
  // 🏆 POINTS GAME
  // =====================================

  if(isPointsGame){

    const scoredPlayers=state.players.filter(p=>
      pointsComp==="stableford"
        ? p.stableford!=null
        : p.netScore!=null
    );

    if(!scoredPlayers.length){
      alert(
        pointsComp==="stableford"
          ? "Enter at least one Stableford score first."
          : "Enter at least one Net score first."
      );
      return;
    }

    let remaining=[...scoredPlayers];

    const places=[];
    const placeNames=["1st","2nd","3rd"];

    for(let place=0; place<3 && remaining.length; place++){

      const bestScore=
        pointsComp==="stableford"
          ? Math.max(...remaining.map(p=>Number(p.stableford)))
          : Math.min(...remaining.map(p=>Number(p.netScore)));

      const tied=remaining.filter(p=>
        pointsComp==="stableford"
          ? Number(p.stableford)===bestScore
          : Number(p.netScore)===bestScore
      );

      let selectedPlayer=tied[0];
      let countback=false;

      if(state.gameType==="points" && (tied.length>1)){

        selectedPlayer=chooseCountbackWinner(
          tied,
          pointsComp==="stableford" ? "Stableford" : "Net",
          pointsComp==="stableford"
            ? bestScore + " points"
            : bestScore,
          placeNames[place]
        );

        if(!selectedPlayer)return;

        countback=true;
      }

      places.push({
        name:selectedPlayer.name,
        score:
          pointsComp==="stableford"
            ? Number(selectedPlayer.stableford)
            : Number(selectedPlayer.netScore),
        position:place+1,
        countback:countback
      });

      remaining=remaining.filter(p=>p!==selectedPlayer);
    }

    const firstPoints=Number(state.pointsValue||10);
    const secondPoints=Math.round(firstPoints*0.6);
    const thirdPoints=Math.round(firstPoints*0.3);

    const pointsAwards=[
      firstPoints,
      secondPoints,
      thirdPoints
    ];
places.forEach((place,i)=>{
  place.points=pointsAwards[i];

  if(isTrip){

    state.trip.standings=state.trip.standings || {};

    state.trip.standings[place.name]=
      Number(state.trip.standings[place.name]||0)+place.points;

  }else{

    const player=state.players.find(p=>p.name===place.name);

    if(player){
      player.leaguePoints=
        Number(player.leaguePoints||0)+place.points;
    }
  }
});
        const record={
      date:state.date,
      course:state.course,

function resultCompetition(record){
  if(record?.pointsCompetition==="net" || record?.pointsCompetition==="stableford")return record.pointsCompetition;
  const players=record?.players||[];
  const netCount=players.filter(p=>p?.netScore!=null || p?.noReturn===true).length;
  const sfCount=players.filter(p=>p?.stableford!=null).length;
  if(netCount && !sfCount)return "net";
  if(sfCount && !netCount)return "stableford";
  if(netCount>=sfCount && netCount)return "net";
  return "stableford";
}
function resultEntrants(record){
  const comp=resultCompetition(record);
  return (record?.players||[]).filter(p=>p?.noReturn===true || (comp==="net" ? p?.netScore!=null : p?.stableford!=null));
}
function sortedFinalStandings(record){
  const comp=resultCompetition(record);
  return resultEntrants(record).slice().sort((a,b)=>{
    if(a.noReturn===true && b.noReturn!==true)return 1;
    if(b.noReturn===true && a.noReturn!==true)return -1;
    if(a.noReturn===true && b.noReturn===true)return String(a.name||"").localeCompare(String(b.name||""));
    const av=Number(comp==="net"?a.netScore:a.stableford);
    const bv=Number(comp==="net"?b.netScore:b.stableford);
    if(av!==bv)return comp==="net" ? av-bv : bv-av;
    return String(a.name||"").localeCompare(String(b.name||""));
  });
}
function finalStandingPosition(record,sorted,index){
  const p=sorted[index];
  if(!p || p.noReturn===true)return "—";
  const comp=resultCompetition(record);
  const value=Number(comp==="net"?p.netScore:p.stableford);
  let first=index;
  while(first>0){
    const prev=sorted[first-1];
    if(prev.noReturn===true)break;
    const prevValue=Number(comp==="net"?prev.netScore:prev.stableford);
    if(prevValue!==value)break;
    first--;
  }
  return String(first+1);
}
function finalStandingScore(record,p){
  if(p?.noReturn===true)return "NR";
  return resultCompetition(record)==="net" ? `Net ${p?.netScore??"—"}` : `${p?.stableford??"—"} pts`;
}
function resultWinnerText(record){
  if(record?.gameType==="points" && record?.pointsResults?.length)return record.pointsResults[0].name||"";
  const comp=resultCompetition(record);
  const names=comp==="net" ? (record?.netWinnerNames||[]) : (record?.stablefordWinnerNames||[]);
  return names.join(" & ") || (record?.winners||[]).join(" & ");
}
function resultWinnerScore(record){
  const winnerName=(record?.gameType==="points" && record?.pointsResults?.length)
    ? record.pointsResults[0].name
    : ((resultCompetition(record)==="net" ? record?.netWinnerNames?.[0] : record?.stablefordWinnerNames?.[0]) || record?.winners?.[0]);
  const p=(record?.players||[]).find(x=>x.name===winnerName);
  if(p)return finalStandingScore(record,p);
  if(record?.gameType==="points" && record?.pointsResults?.length){
    const r=record.pointsResults[0];
    return resultCompetition(record)==="net" ? `Net ${r.score}` : `${r.score} pts`;
  }
  return "—";
}
function resultWinnerValue(record){
  if(record?.gameType==="points"){
    return record?.pointsResults?.[0]?.points!=null ? `+${record.pointsResults[0].points} league pts` : "";
  }
  const comp=resultCompetition(record);
  const pot=Number(comp==="net"?record?.netPot:record?.stablefordPot)||0;
  const names=comp==="net" ? (record?.netWinnerNames||[]) : (record?.stablefordWinnerNames||[]);
  if(names.length>1)return `£${(pot/names.length).toFixed(2).replace(/\.00$/,"")} each`;
  return `£${pot.toFixed(2).replace(/\.00$/,"")}`;
}
function finalStandingsHtml(record){
  const sorted=sortedFinalStandings(record);
  if(!sorted.length)return `<div class="muted">No final standings saved.</div>`;
  return sorted.map((p,i)=>`
    <div class="player row">
      <span class="pos">${esc(finalStandingPosition(record,sorted,i))}</span>
      <div style="flex:1"><b>${esc(p.name||"Player")}</b><div class="muted">HCP ${esc(String(p.handicap??"—"))}</div></div>
      <span class="money">${esc(finalStandingScore(record,p))}</span>
    </div>`).join("");
}

function adminPinEntryModal(title="Admin Access",subtitle="Enter your 4-digit Admin PIN"){
  return new Promise(resolve=>{
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;";
    overlay.innerHTML=`
      <div class="card" style="width:min(420px,100%);margin:0;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
        <div style="font-size:36px;text-align:center;margin-bottom:6px;">🔐</div>
        <h2 style="text-align:center;margin:0 0 6px;">${esc(title)}</h2>
        <p class="muted" style="text-align:center;margin:0 0 20px;">${esc(subtitle)}</p>
        <input id="adminAccessPin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="4 digits" aria-label="4-digit Admin PIN" style="text-align:center;font-size:28px;letter-spacing:10px;font-weight:800;-webkit-text-security:disc;">
        <div id="adminAccessMsg" class="muted" style="min-height:22px;text-align:center;color:var(--red);margin-top:4px;"></div>
        <button class="primary full" id="adminAccessContinue">Continue</button>
        <button class="ghost full" id="adminAccessCancel" style="margin-top:8px;">Cancel</button>
      </div>`;

    document.body.appendChild(overlay);
    const input=overlay.querySelector("#adminAccessPin");
    const msg=overlay.querySelector("#adminAccessMsg");

    input.addEventListener("input",()=>{
      input.value=String(input.value||"").replace(/\D/g,"").slice(0,4);
      msg.textContent="";
    });

    const submit=()=>{
      const entered=String(input.value||"").trim();
      if(!validAdminPin(entered)){
        msg.textContent="Enter your 4-digit Admin PIN.";
        input.focus();
        return;
      }
      if(entered!==adminPinForGroup()){
        msg.textContent="That PIN is not correct. Please try again.";
        input.value="";
        input.focus();
        return;
      }
      overlay.remove();
      resolve(true);
    };

    overlay.querySelector("#adminAccessContinue").onclick=submit;
    overlay.querySelector("#adminAccessCancel").onclick=()=>{overlay.remove();resolve(false);};
    input.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault();submit();}
      if(e.key==="Escape"){overlay.remove();resolve(false);}
    });
    setTimeout(()=>input.focus(),60);
  });
}

function changeAdminPinModal(){
  return new Promise(resolve=>{
    const overlay=document.createElement("div");

        <input id="changePinCurrent" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="4 digits">

        <label><b>New PIN</b></label>
        <input id="changePinNew" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4 digits">

        <label><b>Confirm new PIN</b></label>
        <input id="changePinConfirm" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="Enter it again">

        <div id="changePinMsg" class="muted" style="min-height:22px;color:var(--red);"></div>
        <button class="primary full" id="saveChangedPin">Save New PIN</button>
        <button class="ghost full" id="cancelChangedPin" style="margin-top:8px;">Cancel</button>
      </div>`;

    document.body.appendChild(overlay);
    const current=overlay.querySelector("#changePinCurrent");
    const next=overlay.querySelector("#changePinNew");
    const confirmPin=overlay.querySelector("#changePinConfirm");
    const msg=overlay.querySelector("#changePinMsg");
    [current,next,confirmPin].forEach(input=>input.addEventListener("input",()=>{
      input.value=String(input.value||"").replace(/\D/g,"").slice(0,4);
      msg.textContent="";
    }));

    const submit=()=>{
      const cur=String(current.value||"").trim();
      const one=String(next.value||"").trim();
      const two=String(confirmPin.value||"").trim();

      if(cur!==adminPinForGroup()){
        msg.textContent="Current Admin PIN is incorrect.";
        current.value="";
        current.focus();
        return;
      }
      if(!validAdminPin(one)){
        msg.textContent="Please choose exactly 4 numbers.";
        next.focus();
        return;
      }
      if(one!==two){
        msg.textContent="The two new PINs do not match.";
        confirmPin.focus();
        return;
      }
      overlay.remove();
      resolve(one);
    };

    overlay.querySelector("#saveChangedPin").onclick=submit;
    overlay.querySelector("#cancelChangedPin").onclick=()=>{overlay.remove();resolve(null);};
    confirmPin.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit();}});
    setTimeout(()=>current.focus(),60);
  });
}

async function changeCurrentRoundCompetition(){
  if(!isAdmin)return;
  if(!roundOpenNow()){
    alert("There is no open round to change.");
    return;
  }
  if(roundLocked()){
    alert("Competition cannot be changed after scoring has started.");
    return;
  }
  const current=(state.pointsCompetition||"stableford")==="net" ? "net" : "stableford";
  const next=current==="stableford" ? "net" : "stableford";
  const currentLabel=current==="stableford" ? "Stableford" : "Net";
  const nextLabel=next==="stableford" ? "Stableford" : "Net";
  if(!confirm(`Change this round from ${currentLabel} to ${nextLabel}?\n\nPlayers, payments, course, date and stake will stay unchanged.`))return;
  state.pointsCompetition=next;
  // Keep legacy per-player competition data aligned where no score has been submitted.
  state.players.forEach(p=>{
    if(p.stableford==null && p.netScore==null && p.noReturn!==true){
      p.competition=next;
    }
  });
  await save();
  alert(`✅ Competition changed to ${nextLabel}.`);
  settingsPage();
}

async function deleteOwnerGroup(groupPin){

  if(!db || !isAdmin || !isOwner || !ownerCreationCode){
    alert("I'm In Golf Owner access required.");
    return;
  }

  const cleanPin=String(groupPin||"");

  if(cleanPin==="1010"){
    alert("🔐 The Owner group cannot be deleted.");
    return;
  }

  const g=ownerGroups.find(
    x=>String(x.group_pin)===cleanPin
  );

  if(!g){
    alert("Group could not be found.");
    return;
  }

  const groupName=String(g.group_name||"Unnamed Group");

  const firstConfirm=confirm(
    "🗑️ Delete " + groupName + "?\n\n" +
    "Group PIN: " + cleanPin + "\n\n" +
    "This permanently removes this group and its saved group data.\n\n" +
    "This cannot be undone."
  );

  if(!firstConfirm)return;

  const typed=prompt(
    "Final confirmation\n\n" +
    "Type the Group PIN " + cleanPin + " to permanently delete " + groupName + "."
  );

  if(typed===null)return;

  if(String(typed).trim()!==cleanPin){
    alert("Group PIN did not match. Nothing was deleted.");
    return;
  }

  const {error}=await db.rpc(
    "owner_delete_group",
    {
      p_creation_code:ownerCreationCode,
      p_group_pin:cleanPin
    }
  );

  if(error){
    alert(
      "Group could not be deleted.\n\n" +
      (error.message||"Please try again.")
    );
    return;
  }

  alert("✅ " + groupName + " deleted.");
  await manageGroupsPage();
}

async function ownerResetAdminPin(){
  if(!db || !isAdmin || !isOwner || !ownerCreationCode){
    alert("I'm In Golf Owner access required.");
    return;
  }

  const groupPin=String(ownerEditGroupPin||"");
  if(!groupPin){
    alert("Group could not be identified.");
    return;
  }

  const first=prompt("Choose a new 4-digit Admin PIN for group " + groupPin);
  if(first===null)return;

  const clean=String(first).trim();
  if(!validAdminPin(clean)){
    alert("Please choose exactly 4 numbers.");
    return;
  }

  const second=prompt("Enter the new 4-digit Admin PIN again");
  if(second===null)return;

  if(String(second).trim()!==clean){
    alert("The two PINs did not match.");
    return;
  }

  const ok=confirm("Reset the Admin PIN for group " + groupPin + "?");
  if(!ok)return;

  const {data,error}=await db.rpc(
    "owner_reset_admin_pin",
    {
      p_creation_code:ownerCreationCode,
      p_group_pin:groupPin,
      p_new_admin_pin:clean
    }
  );

  if(error || data!==true){
    alert(
      "Admin PIN could not be reset.\n\n" +
      (error?.message || "Please try again.")
    );
    return;
  }

  if(groupPin===String(pin)){
    state.adminPin=clean;
    state.adminSetupToken="";
  }

  alert("✅ Admin PIN reset for group " + groupPin + ".");
}

async function saveOwnerGroupEdit(){
  if(!db || !isOwner || !ownerCreationCode)return;

  const g=ownerGroups.find(x=>String(x.group_pin)===String(ownerEditGroupPin));
  if(!g)return;

  const protectedGroup=String(g.group_pin)==="1010";

  const args={
    p_creation_code:ownerCreationCode,
    p_group_pin:String(g.group_pin),
    p_admin_name:$("ownerAdminName").value.trim(),
    p_admin_contact:$("ownerAdminContact").value.trim(),
    p_plan_type:protectedGroup ? "internal" : $("ownerPlanType").value,
    p_trial_expiry_date:$("ownerTrialExpiry").value || null,
    p_paid_status:$("ownerPaidStatus").value,
    p_renewal_date:$("ownerRenewalDate").value || null,
    p_status:protectedGroup ? "active" : $("ownerGroupStatus").value,
    p_notes:$("ownerNotes").value.trim()
  };

  const saveButton=document.querySelector('#screen button.primary');
  if(saveButton){
    saveButton.disabled=true;
    saveButton.textContent="Saving…";
  }

  const {error}=await db.rpc("owner_update_group",args);

  if(error){
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent="💾 Save Changes";
    }
    alert("Group changes could not be saved.\n\n" + (error.message||"Please try again."));
    return;
  }

  alert("✅ Group details updated.");
  ownerEditGroupPin="";
  await manageGroupsPage();
}

function formatOwnerDate(value){
  if(!value)return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function ownerLogin(){
  if(!isAdmin){
    alert("Admin access required first.");
    return;
  }

  const entered=prompt("Enter your private I'm In Golf owner creation code");
  if(entered===null)return;

  const clean=entered.trim();

  if(!clean){
    alert("Owner creation code is required.");
    return;
  }

  ownerCreationCode=clean;
  isOwner=true;
  render();
}

function ownerLogout(){
  isOwner=false;
  ownerCreationCode="";
  if(db && !poller) startPolling();
  render();
}

function adminInvitePage(){
  if(!lastAdminInvite){
    show("settings");
    return;
  }

  const lines=lastAdminInvite.split("\n");
  const groupLine=lines.find(line=>line.startsWith("You've been invited to manage:")) || "";
  const pinLine=lines.find(line=>line.startsWith("Group PIN:")) || "";

  const groupName=groupLine.replace("You've been invited to manage:","").trim();
  const newPin=pinLine.replace("Group PIN:","").trim();

  $("screen").innerHTML=`
    <div class="card">
      <h2>✅ New group created!</h2>
      <div class="big">${esc(groupName || "New Golf Group")}</div>
      <div class="notice">
        <b>Group PIN: ${esc(newPin)}</b><br>
        Send the private Admin invite to the person who will manage this group.
      </div>
    </div>

    <div class="card">
      <h2>📤 Admin invite</h2>
      <button class="primary full" onclick="shareAdminInvite()">
        📤 Share Admin Invite
      </button>
      <button class="secondary full" onclick="copyAdminInvite()">
        📋 Copy Admin Invite
      </button>
      <button class="ghost full" onclick="show('settings')">
        Back to Settings
      </button>
    </div>`;
}

async function copyAdminInvite(){
  if(!lastAdminInvite){ alert("Create a new group first."); return; }
  try{
    await navigator.clipboard.writeText(lastAdminInvite);
    alert("✅ Admin invite copied.");
  }catch(e){
    prompt("Copy this Admin invite:",lastAdminInvite);
  }
}
async function shareAdminInvite(){
  if(!lastAdminInvite){ alert("Create a new group first."); return; }
  if(navigator.share){
    try{
      await navigator.share({title:"I'm In Golf – Admin Invite",text:lastAdminInvite});
      return;
    }catch(e){
      if(e && e.name==="AbortError")return;
    }
  }
  await copyAdminInvite();
}

async function createNewGolfGroup(){

  if(!isAdmin || !isOwner || !ownerCreationCode){
    alert("I'm In Golf Owner access required.");
    return;
  }

  if(!db){
    alert("Database connection is not available.");
    return;
  }

  const groupName=prompt("New golf group name:");
  if(groupName===null)return;

  const cleanGroupName=groupName.trim();

  if(!cleanGroupName){
    alert("Please enter a group name.");
    return;
  }

  const newState={
    groupName:cleanGroupName,
    course:"",
    date:"",
    stake:0,
    gameType:"money",
    roundOpen:false,
    pointsCompetition:"stableford",
    pointsValue:10,
    adminPin:"",
    adminSetupToken:"",
    players:[],
    history:[]
  };

  const {data,error}=await db.rpc(
    "create_golf_group",
    {
      p_group_name:cleanGroupName,
      p_state:newState,
      p_creation_code:ownerCreationCode
    }
  );

  if(error){
    isOwner=false;
    ownerCreationCode="";
    render();
    alert("Owner access was not accepted.\n\nCheck your private owner creation code and try again.");
    return;
  }

  const newPin=String(data);
  const setupToken=
    (crypto.randomUUID ? crypto.randomUUID() :
      (Date.now().toString(36)+Math.random().toString(36).slice(2)));

  const createdState={...newState,adminSetupToken:setupToken};
  const {error:setupError}=await db.rpc(
    "save_group_state",
    {p_pin:newPin,p_state:createdState}
  );

  if(setupError){
    alert("The group was created, but Admin setup could not be prepared. Please try again before sending the invite.");
    return;
  }

  const invite=
`⛳ I'm In Golf

You've been invited to manage ${cleanGroupName}.

Group PIN: ${newPin}

Tap below to set up your 4-digit Admin PIN:
https://imingolf.co.uk/app/?pin=${encodeURIComponent(newPin)}&adminsetup=${encodeURIComponent(setupToken)}

🔒 Keep this link private.`;

  lastAdminInvite=invite;
  page="admininvite";
  adminInvitePage();
  window.scrollTo(0,0);
}

function competitionReminder(){
if(roundLocked()){
    alert("🔒 Entries are closed — scoring has started.");
    return;
  }

  const notPaid=state.players
    .filter(p=>!p.paid)
    .map(p=>p.name);

  const noCompetition=state.players
    .filter(p=>p.paid && !p.competition)
    .map(p=>p.name);

  if(!notPaid.length && !noCompetition.length){
    alert("Everyone is paid and entered into a competition.");
    return;
  }

  let message=`⛳ I'm In Golf — Competition Reminder

${state.course}
${formatDate(state.date)}

`;

  if(notPaid.length){
    message+=`💷 Still to pay:
${notPaid.join(", ")}

`;
  }

  if(noCompetition.length){
    message+=`🏆 Still to choose Stableford or Net:
${noCompetition.join(", ")}

`;
  }

  message+="Please pay your entry and choose Stableford or Net before scoring starts.";

  if(navigator.share){
    navigator.share({
      title:"I'm In Golf — Competition Reminder",
      text:message
    });
  }else{
    navigator.clipboard?.writeText(message);
    alert("Competition reminder copied. Paste it into WhatsApp.");
  }
}

function organiserAdminPinSetup(groupName){
  return new Promise(resolve=>{
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;";
    overlay.innerHTML=`
      <div class="card" style="width:min(440px,100%);margin:0;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
        <div style="font-size:34px;margin-bottom:8px;">🔐</div>
        <h2 style="margin:0 0 8px;">Create your Admin PIN</h2>
        <p class="muted" style="margin-top:0;">Choose a private 4-digit PIN for <b>${esc(groupName)}</b>. You'll use it whenever you need to manage your group.</p>

        <div style="margin-top:20px;">
          <label><b>Admin PIN</b></label>
          <input id="setupAdminPin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" placeholder="4 digits">
          <label><b>Confirm PIN</b></label>
          <input id="setupAdminPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" placeholder="Enter the same 4 digits again">
          <div id="setupAdminPinMsg" class="muted" style="min-height:18px;color:var(--red);"></div>
          <button class="primary full" id="createSetupAdminPin">Create Admin PIN</button>
        </div>
      </div>`;

    document.body.appendChild(overlay);
    const first=overlay.querySelector("#setupAdminPin1");
    const second=overlay.querySelector("#setupAdminPin2");
    const msg=overlay.querySelector("#setupAdminPinMsg");
    const button=overlay.querySelector("#createSetupAdminPin");

    const digitsOnly=input=>{
      input.value=String(input.value||"").replace(/\D/g,"").slice(0,4);
    };
    first.addEventListener("input",()=>digitsOnly(first));
    second.addEventListener("input",()=>digitsOnly(second));

    const submit=()=>{
      const one=String(first.value||"").trim();
      const two=String(second.value||"").trim();

      if(!validAdminPin(one)){
        msg.textContent="Please choose exactly 4 numbers.";
        first.focus();
        return;
      }
      if(two!==one){
        msg.textContent="The two PINs do not match.";
        second.focus();
        return;
      }

      button.disabled=true;
      overlay.remove();
      resolve(one);
    };

    button.onclick=submit;
    first.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        second.focus();
      }
    });
    second.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        submit();
      }
    });

    setTimeout(()=>first.focus(),50);
  });
}

function normalisePaymentLink(value){
  const clean=String(value||"").trim();
  if(!clean)return "";
  try{const u=new URL(clean);return (u.protocol==="https:" || u.protocol==="http:") ? u.href : "";}catch(e){return "";}
}

async function changePaymentLink(){
  if(!isAdmin)return;
  const current=String(state.paymentLink||"");
  const answer=prompt("Paste the payment link where players should pay you.\n\nPayments go directly to you — I'm In Golf does not receive or hold the money.",current);
  if(answer===null)return;
  if(!String(answer).trim()){
    if(current && confirm("Remove the current payment link?")){state.paymentLink="";await save();render();}
    return;
  }
  const link=normalisePaymentLink(answer);
  if(!link){alert("Please enter a valid payment link beginning with https://");return;}
  state.paymentLink=link;await save();render();alert("✅ Payment link saved.");
}

async function cancelCurrentRound(){
  if(!isAdmin){
    alert("🔒 Only the group Admin can cancel the current round.");
    return;
  }

  if(state.trip?.active){
    alert("Use Cancel Current Trip for an active trip.");
    return;
  }

  const hasRoundSetup=
    Boolean(String(state.course||"").trim()) ||
    Boolean(state.date) ||
    state.players.some(p=>
      p.paid ||
      p.scoreSubmitted ||
      p.stableford!=null ||
      p.netScore!=null ||
      p.noReturn===true ||
      Boolean(p.competition)
    );

  if(!hasRoundSetup){
    alert("There is no current round to cancel.");
    return;
  }

  if(!confirm(
    "Cancel the current round?\n\n" +
    "This clears only the current round setup, payments, competition choices and scores.\n\n" +
    "Players, league standings and previous-round history will NOT be deleted."
  ))return;

  state.course="";
  state.date="";
  state.gameType="money";
  state.pointsCompetition="stableford";
  state.pointsValue=10;
  state.roundOpen=false;

  state.players.forEach(p=>{
    p.paid=false;
    p.competition=null;
    p.stableford=null;
    p.netScore=null;
    p.noReturn=false;
    p.scoreSubmitted=false;
  });

  scoreDraftActive=false;

  const ok=await save();
  if(!ok){
    alert("The current round could not be cancelled. Please try again.");
    return;
  }

  alert("✅ Current round cancelled. League and history were kept.");
  show("round");
}

function tripSetupScreen(){
  return new Promise(resolve=>{
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;padding:16px;overflow:auto;";
    overlay.innerHTML=`
      <div class="card" style="width:min(720px,100%);margin:18px auto;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
        <div style="font-size:34px;text-align:center;margin-bottom:6px;">✈️</div>
        <h2 style="margin:0 0 6px;text-align:center;">Set Up Golf Trip</h2>
        <p class="muted" style="margin:0 0 20px;text-align:center;">Set up the trip once. Each round will be ready when you get to it.</p>

        <label style="display:block;margin:0 0 6px;">Trip name</label>
        <input id="tripSetupName" type="text" value="${String(state.trip?.name||'Golf Trip').replace(/"/g,'&quot;')}" style="width:100%;margin-bottom:14px;">

        <label style="display:block;margin:0 0 6px;">Number of rounds</label>
        <input id="tripSetupRounds" type="number" min="1" max="12" step="1" value="${Number(state.trip?.totalRounds||3)}" style="width:100%;margin-bottom:16px;">

        <div style="margin-bottom:8px;font-weight:800;">Trip Championship</div>
        <div class="muted" style="margin-bottom:10px;">Choose the scoring used for the overall trip standings. The same scoring is used for each trip round so players only enter one score.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
          <button id="tripCompStableford" class="primary">🏆 Stableford</button>
          <button id="tripCompNet" class="secondary">⛳ Net</button>
        </div>
        <div class="notice" style="margin-bottom:18px;"><b>🏆 Trip Championship points</b><br>🥇 1st — 10 pts&nbsp;&nbsp; 🥈 2nd — 6 pts&nbsp;&nbsp; 🥉 3rd — 3 pts</div>

        <div id="tripRoundsWrap"></div>
        <div id="tripSetupError" class="notice warning" style="display:none;margin:10px 0 12px;"></div>
        <button id="tripSetupStart" class="primary" style="width:100%;padding:14px 16px;margin-bottom:10px;">✈️ Start Golf Trip</button>
        <button id="tripSetupCancel" class="secondary" style="width:100%;">Cancel</button>
      </div>`;
    document.body.appendChild(overlay);

    let tripCompetition='stableford';
    let drafts=[];
    const roundsInput=overlay.querySelector('#tripSetupRounds');
    const wrap=overlay.querySelector('#tripRoundsWrap');
    const err=overlay.querySelector('#tripSetupError');
    const setTripComp=(comp)=>{
      tripCompetition=comp;
      overlay.querySelector('#tripCompStableford').className=comp==='stableford'?'primary':'secondary';
      overlay.querySelector('#tripCompNet').className=comp==='net'?'primary':'secondary';
      renderRounds();
    };
    const readExisting=()=>{
      [...wrap.querySelectorAll('[data-trip-round]')].forEach(card=>{
        const i=Number(card.dataset.tripRound);
        drafts[i]=drafts[i]||{};
        drafts[i].course=card.querySelector('[data-course]')?.value||'';
        drafts[i].date=card.querySelector('[data-date]')?.value||'';
        drafts[i].stake=Number(card.querySelector('[data-stake]')?.value||0);
        drafts[i].gameType=card.dataset.gameType||'money';
      });
    };
    function renderRounds(){
      readExisting();
      const count=Math.max(1,Math.min(12,Number(roundsInput.value||1)));
      wrap.innerHTML='';
      for(let i=0;i<count;i++){
        const d=drafts[i]||{course:'',date:'',stake:'',gameType:i===0?'money':'money'};
        drafts[i]=d;
        const card=document.createElement('div');
        card.dataset.tripRound=i;
        card.dataset.gameType=d.gameType||'money';
        card.className='notice';
        card.style.cssText='margin:0 0 14px;padding:16px;';
        card.innerHTML=`
          <div style="font-weight:900;font-size:17px;margin-bottom:12px;">Round ${i+1}</div>
          <label style="display:block;margin:0 0 5px;">Course</label>
          <input data-course type="text" value="${String(d.course||'').replace(/"/g,'&quot;')}" placeholder="Course" style="width:100%;margin-bottom:10px;">
          <label style="display:block;margin:0 0 5px;">Date</label>
          <input data-date type="date" value="${d.date||''}" style="width:100%;margin-bottom:10px;">
          <div style="font-weight:700;margin-bottom:6px;">Game</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
            <button type="button" data-money class="${card.dataset.gameType==='money'?'primary':'secondary'}">💷 Money Game</button>
            <button type="button" data-points class="${card.dataset.gameType==='points'?'primary':'secondary'}">🏆 Points Game</button>
          </div>
          <div style="margin-bottom:10px;"><b>Competition:</b> ${tripCompetition==='net'?'⛳ Net':'🏆 Stableford'}</div>
          <div data-stake-wrap style="${card.dataset.gameType==='money'?'':'display:none;'}">
            <label style="display:block;margin:0 0 5px;">Stake per player (£)</label>
            <input data-stake type="number" min="0" step="0.01" value="${d.stake==='' ? '' : (Number.isFinite(Number(d.stake)) ? Number(d.stake) : '')}" placeholder="Enter stake" style="width:100%;">
          </div>`;
        wrap.appendChild(card);
        const money=card.querySelector('[data-money]');
        const points=card.querySelector('[data-points]');
        const stakeWrap=card.querySelector('[data-stake-wrap]');
        const setGame=g=>{
          card.dataset.gameType=g; drafts[i].gameType=g;
          money.className=g==='money'?'primary':'secondary';
          points.className=g==='points'?'primary':'secondary';
          stakeWrap.style.display=g==='money'?'':'none';
        };
        money.onclick=()=>setGame('money');
        points.onclick=()=>setGame('points');
      }
    }
    roundsInput.addEventListener('change',renderRounds);
    overlay.querySelector('#tripCompStableford').onclick=()=>setTripComp('stableford');
    overlay.querySelector('#tripCompNet').onclick=()=>setTripComp('net');
    const finish=value=>{ overlay.remove(); resolve(value); };
    overlay.querySelector('#tripSetupCancel').onclick=()=>finish(null);
    overlay.querySelector('#tripSetupStart').onclick=()=>{
      readExisting();
      const name=overlay.querySelector('#tripSetupName').value.trim();
      const totalRounds=Number(roundsInput.value);
      let msg='';
      if(!name) msg='Please enter a trip name.';
      else if(!Number.isInteger(totalRounds)||totalRounds<1||totalRounds>12) msg='Please enter a valid number of rounds.';
      const rounds=[];
      if(!msg){
        for(let i=0;i<totalRounds;i++){
          const card=wrap.querySelector(`[data-trip-round="${i}"]`);
          const course=card?.querySelector('[data-course]')?.value.trim()||'';
          const date=card?.querySelector('[data-date]')?.value||'';
          const gameType=card?.dataset.gameType||'money';
          const stake=gameType==='money'?Number(card?.querySelector('[data-stake]')?.value||0):0;
          if(!course){ msg=`Please enter the course for Round ${i+1}.`; break; }
          if(!date){ msg=`Please choose the date for Round ${i+1}.`; break; }
          if(gameType==='money' && (!Number.isFinite(stake)||stake<0)){ msg=`Please enter a valid stake for Round ${i+1}.`; break; }
          rounds.push({course,date,gameType,competition:tripCompetition,stake});
        }
      }
      if(msg){ err.textContent=msg; err.style.display='block'; return; }
      finish({name,totalRounds,competition:tripCompetition,tripPointsValue:10,rounds});
    };
    overlay.addEventListener('click',e=>{ if(e.target===overlay) finish(null); });
    renderRounds();
  });
}

async function deletePastTrip(){

  const pastTrips=state.trip?.pastTrips || [];

  if(!pastTrips.length){
    alert("There are no past trips to delete.");
    return;
  }

  const names=pastTrips.map((t,i)=>
    (i+1) + ". " + (t.name || "Unnamed Trip")
  ).join("\n");

  const answer=prompt(
    "Delete which past trip?\n\n" +
    names +
    "\n\nEnter the trip number."
  );

  if(answer===null)return;

  const index=Number(answer)-1;

  if(index<0 || index>=pastTrips.length){
    alert("Please enter a valid trip number.");
    return;
  }

  const tripName=pastTrips[index].name || "Trip";

  if(!confirm(
    "Delete " + tripName + "?\n\n" +
    "This removes only this past Trip.\n\n" +
    "Normal leagues, players and current round will not be changed."
  ))return;

  pastTrips.splice(index,1);

  state.trip.pastTrips=pastTrips;

  await save();
  render();

  alert(tripName + " deleted.");
}
async function finishTrip(){

  if(!state.trip?.completed){
    alert("The Trip is not complete yet.");
    return;
  }

  const tripName=state.trip.name || "Trip";

  if(!confirm(
    "🏁 Finish " + tripName + "?\n\n" +
    "The completed Trip and final standings will be saved.\n\n" +
    "Your normal round will then be restored."
  ))return;

  // Find the normal round backup
  const backup=
    state.trip?.normalRoundBackup ||
    state.trip?.pastTrips?.[0]?.normalRoundBackup;

  if(!backup){
    alert(
      "Normal round backup could not be found.\n\n" +
      "The Trip has not been closed."
    );
    return;
  }

  // Keep existing archived trips separate
  const existingPastTrips=[
    ...(state.trip?.pastTrips || [])
  ];

  // Create a clean completed Trip copy.
  // IMPORTANT: do not copy pastTrips into itself.
  const completedTrip={
    name:state.trip.name,
    totalRounds:state.trip.totalRounds,
    currentRound:state.trip.currentRound,
    competition:state.trip.competition,
    tripPointsValue:state.trip.tripPointsValue,
    rounds:[...(state.trip.rounds || [])],
    standings:{...(state.trip.standings || {})},
    champion:state.trip.champion || tripStandingsSorted()[0]?.name || null,
    completed:true,
    active:false,
    normalRoundBackup:state.trip.normalRoundBackup || backup
  };

  const pastTrips=[
    completedTrip,
    ...existingPastTrips
  ];

  // Return cleanly to normal golf after the Trip.
  // Keep the normal defaults/players, but do not reopen a stale or blank round.
  state.course=backup.course || "";
  state.date="";
  state.stake=backup.stake;
  state.gameType=backup.gameType || "points";
  state.pointsCompetition=backup.pointsCompetition || "stableford";
  state.pointsValue=backup.pointsValue || 10;
  state.roundOpen=false;

  state.players=backup.players.map(p=>({
    id:p.id,
    name:p.name,
    handicap:p.handicap,
    paid:false,
    competition:null,
    stableford:null,
    netScore:null,
    noReturn:false,
    scoreSubmitted:false,
    wins:p.wins,
    leaguePoints:p.leaguePoints,
    netWinnings:p.netWinnings
  }));

  // Trip Mode is now closed,
  // but completed Trips remain archived.
  state.trip={
    active:false,
    name:"",
    totalRounds:0,
    currentRound:0,
    competition:null,
    tripPointsValue:10,
    rounds:[],
    standings:{},
    champion:null,
    completed:false,
    pastTrips:pastTrips
  };

  await save();
  show("round");

  alert(
    "🏁 " + tripName + " saved.\n\n" +
    "You're ready to set up the next competition."
  );
}

async function deleteLastRound(){
  if(!state.history || !state.history.length){
    alert("There are no completed rounds to delete.");
    return;
  }

  const lastRound=state.history[0];

  const winnerNames=(lastRound.winners||[]).join(", ") || "No winner recorded";

  let extraText="";

  if(lastRound.gameType==="points" && lastRound.pointsResults?.length){
    extraText=
      "\n\nPoints to be removed:\n" +
      lastRound.pointsResults.map(r=>
        r.name + " -" + r.points + " pts"
      ).join("\n");
  }

  const deleteMessage=
    "Delete this completed round?\n\n" +
    lastRound.course + " • " + formatDate(lastRound.date) + "\n" +
    "Winner: " + winnerNames +
    extraText +
    "\n\nThis will remove the round and correct the league stats.\n\n" +
    "Are you sure?";

  if(!confirm(deleteMessage))return;

  // Undo winner win
  (lastRound.winners||[]).forEach(name=>{
    const p=state.players.find(x=>x.name===name);

    if(p && (p.wins||0)>0){
      p.wins=p.wins-1;
    }
  });

  // Undo Points Game league points
  if(lastRound.gameType==="points" && lastRound.pointsResults?.length){

    lastRound.pointsResults.forEach(result=>{
      const p=state.players.find(x=>x.name===result.name);

      if(p){
        p.leaguePoints=Math.max(
          0,
          Number(p.leaguePoints||0)-Number(result.points||0)
        );
      }
    });
  }

  state.history.shift();

  render();
  await save();

  alert("Last round deleted and league stats corrected.");
}

  "There is NO undo.\n\n" +
  "Past Trips will be kept.\n\n" +
  "Press OK again to PERMANENTLY DELETE the Points League and Money & Points round history."
))return;

 state.players.forEach(p=>{
   p.wins=0;
   p.leaguePoints=0;
   p.netWinnings=0;
 });

 state.history=[];

 render();
 await save();

 alert("League and previous round history cleared.");
}
function copyInvite(){
  const url="https://imingolf.co.uk/app/?pin="+encodeURIComponent(pin);

  const groupName=String(state.groupName||"our golf group").trim();
  const message=`⛳ I'm In Golf

You've been invited to join ${groupName}.
Group PIN: ${pin}

Tap below to join:
${url}`;

  navigator.clipboard?.writeText(message);
  alert("Invite copied. Paste it into WhatsApp.");
}
function formatDate(d){
 if(!d || !d.includes("-"))return d;
 const [y,m,day]=d.split("-");
 return `${Number(day)}.${Number(m)}.${y.slice(2)}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s)}
</script>
