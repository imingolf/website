<!doctype html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I'm In Golf</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17231b;--muted:#68736c;--green:#176b3a;--green2:#23864e;--line:#dce3dd;--amber:#8a6500;--amberbg:#fff1c7;--red:#a83b34;--redbg:#fbe4e1}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:76px}
header{background:linear-gradient(135deg,#10592f,#23864e);color:white;padding:calc(24px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:30px} header p{margin:5px 0 0;opacity:.85}
main{padding:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
h2{font-size:18px;margin:0 0 12px}.muted{font-size:13px;color:var(--muted)}.big{font-size:28px;font-weight:800}
.pill{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px}.paid{background:#def4e5;color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.danger{background:var(--redbg);color:var(--red)}
.player{padding:12px 0;border-top:1px solid var(--line)}.player:first-child{border-top:0}
button{border:0;border-radius:12px;padding:11px 13px;font-weight:750;font-size:14px}.primary{background:var(--green);color:white}.secondary{background:#edf4ef;color:var(--green)}.ghost{background:#f3f4f3;color:#536058}.red{background:var(--redbg);color:var(--red)}
.full{width:100%;margin-top:10px}.small{padding:8px 10px;font-size:12px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:white;margin:5px 0 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#edf5ef;padding:11px;border-radius:12px;font-size:13px;margin:10px 0}.warning{background:#fff5dc}
.comp-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}.comp-choice button{border:2px solid var(--line);background:#f3f4f3;color:#536058;padding:14px 8px;font-size:15px}.comp-choice button.selected{background:var(--green);border-color:var(--green);color:white}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line);display:flex;z-index:20}
nav button{flex:1;background:transparent;color:#6d756f;padding:11px 2px;font-size:13px;line-height:1.35}nav button.active{color:var(--green);font-weight:800}
.pay-sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:white;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 6px 22px rgba(0,0,0,.14);z-index:19}
.pay-sticky .full{margin-top:0}.pay-screen-spacer{height:82px}
.finish-sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:white;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 6px 22px rgba(0,0,0,.14);z-index:19}.finish-sticky .full{margin-top:0}.finish-screen-spacer{height:82px}
.score{width:78px;margin:0}.pos{font-weight:800;font-size:18px;min-width:24px}.money{font-weight:800}
#setupOverlay{position:fixed;inset:0;background:#f4f6f3;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:45px 16px;overflow:auto}
.setup{width:min(480px,100%)}.hidden{display:none!important}
</style>
</head>
<body>
<div id="setupOverlay">
 <div class="setup">
  <div class="card">
   <h1 style="margin-top:0">⛳ I'm In Golf</h1>
   <p>Golf. Mates. You're In.</p>
   <div id="configMissing" class="notice warning hidden"><b>One-time setup needed.</b><br>This shared version needs your Supabase project details added to <code>config.js</code>.</div>
   <label><b>Group PIN</b></label>
<input id="pinInput" inputmode="numeric" autocomplete="off" placeholder="Enter your shared PIN">
<button class="primary full" onclick="connect()">Open I'm In Golf</button>
<div id="connectMsg" class="muted" style="margin-top:10px"></div>
     </div>
 </div>
</div>

<div class="app">
<header>
  <h1>
    I'm In Golf ⛳
    <span id="demoBadge" class="hidden" style="
      font-size:12px;
      background:#fff1c7;
      color:#8a6500;
      padding:5px 9px;
      border-radius:999px;
      vertical-align:middle;
      margin-left:6px;
    ">DEMO</span>
  </h1>
  <p id="syncText">Shared golf group</p>
</header>
<main><div id="screen"></div></main>
<nav>
<button id="nround" onclick="show('round')">⛳<br>Round</button>
<button id="npay" onclick="show('pay')">💷<br>Pay</button>
<button id="nscores" onclick="show('scores')">🏌️<br>Scores</button>
<button id="nleague" onclick="show('league')">🏆<br>League</button>
<button id="nplayers" onclick="show('players')">👥<br>Players</button>
<button id="nsettings" class="hidden" onclick="leaveManageGroups()">⚙️<br>Settings</button>
</nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
let db=null, pin="", page="round", poller=null;
let leagueView="points";
let selectedPastTripIndex=0;
let roundEditOpen=false;

function demoReadOnly(){
  return pin==="2026" && !isAdmin;
}
function demoCanEdit(){
  if(demoReadOnly()){
    appAlert("👀 Demo Mode\n\nThis demo is read-only.\nYou can explore the app without changing anything.");
    return false;
  }
  return true;
}
let lastWinnerRecord=null;
let statsPlayerId=null;
let myPlayerId="";
let pendingFirstWelcome="";

function playerIdentityKey(groupPin){
  return "tensInPlayerId_" + String(groupPin||"").trim();
}

function loadMyPlayerForGroup(){
  myPlayerId=localStorage.getItem(playerIdentityKey(pin))||"";
}

function saveMyPlayerForGroup(){
  if(!pin || !myPlayerId)return;
  localStorage.setItem(playerIdentityKey(pin),myPlayerId);
}

function clearMyPlayerForGroup(){
  if(pin)localStorage.removeItem(playerIdentityKey(pin));
  myPlayerId="";
}
function chooseMyPlayer(){
  const existing=state.players.find(p=>p.id===myPlayerId);
  if(existing)return;

  document.querySelector("nav").style.display="none";

  $("screen").innerHTML=`
    <div class="card">
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:42px;">👋</div>
        <h2 style="margin:6px 0 8px;">Join your golf group</h2>
        <div class="muted">Tell us who you are to get started.</div>
      </div>
      ${state.players.length ? `
        <div class="notice" style="margin-bottom:12px;">
          <b>Already in the group?</b><br>Tap your name below.
        </div>
        ${[...state.players].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`
          <button class="secondary full" onclick="selectMyPlayer('${p.id}')">
            ${esc(p.name)}
          </button>
        `).join("")}
        <div class="notice" style="margin-top:18px;">
          <b>Can't see your name?</b><br>
          Add yourself with your name and handicap.
        </div>
      ` : `
        <div class="notice" style="margin-top:12px;">
          <b>You're the first player joining this group.</b><br>
          Add your name and handicap to get started.
        </div>
      `}
      <button class="primary full" onclick="addPlayer()">
        ➕ Add myself to the group
      </button>
    </div>
  `;
}
function installDeviceType(){
  const ua=navigator.userAgent||"";
  if(/iPhone|iPad|iPod/i.test(ua))return "iphone";
  if(/Android/i.test(ua))return "android";
  return "other";
}

function iosShareIcon(){
  return `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"
    style="vertical-align:middle">
    <path d="M12 16V3M12 3L8.5 6.5M12 3l3.5 3.5M6.5 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1.5"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function showInstallHelp(playerName){
  page="installhelp";
  clearInterval(poller);
  poller=null;

  const device=installDeviceType();

  let steps="";
  if(device==="iphone"){
    steps=`
      <div class="notice" style="text-align:left;margin-top:14px;">
        <b>iPhone — 3 simple steps</b><br><br>
        <b>1.</b> Make sure this page is open in <b>Safari</b>.<br><br>
        <b>2.</b> Tap the <b>•••</b> button at the bottom-right. Then tap <b>Share</b> ${iosShareIcon()}.<br><span class="muted">If you can already see Share, just tap it.</span><br><br>
        <b>3.</b> Scroll down and tap <b>Add to Home Screen</b>, then tap <b>Add</b>.
      </div>`;
  }else if(device==="android"){
    steps=`
      <div class="notice" style="text-align:left;margin-top:14px;">
        <b>Android — 3 simple steps</b><br><br>
        <b>1.</b> Make sure this page is open in <b>Chrome</b>.<br><br>
        <b>2.</b> Tap the <b>⋮ three-dot menu</b>.<br><br>
        <b>3.</b> Tap <b>Add to Home screen</b> (or <b>Install app</b>), then confirm.
      </div>`;
  }else{
    steps=`
      <div class="notice" style="text-align:left;margin-top:14px;">
        <b>Add I'm In Golf to your Home Screen</b><br><br>
        <b>iPhone:</b> Safari → <b>•••</b> → Share ${iosShareIcon()} → Add to Home Screen.<br>
        <span class="muted">If you can already see Share, just tap it.</span><br><br>
        <b>Android:</b> Chrome → ⋮ → Add to Home screen / Install app.
      </div>`;
  }

  $("screen").innerHTML=`
    <div class="card" style="text-align:center;">
      <div style="font-size:44px;">✅</div>
      <h2 style="font-size:24px;margin-top:8px;">You're in, ${esc(playerName)}!</h2>
      <div class="muted">This device will remember who you are.</div>

      <h2 style="margin-top:24px;">📱 Put I'm In Golf on your Home Screen</h2>
      <div class="muted">It only takes a few seconds.</div>

      ${steps}

      <button class="primary full" onclick="finishInstallHelp()">
        Continue to I'm In Golf
      </button>
      <button class="ghost full" onclick="finishInstallHelp()">
        I'll do this later
      </button>
    </div>`;
}

function finishInstallHelp(){
  if(db && !poller) startPolling();
  if(pendingFirstWelcome){
    showFirstWelcome(pendingFirstWelcome);
    pendingFirstWelcome="";
    return;
  }
  page="round";
  show("round");
}
function showFirstWelcome(role){
  page="firstwelcome";
  const me=state.players.find(p=>p.id===myPlayerId);
  const name=me?.name || "there";
  document.querySelector("nav").style.display="none";
  if(role==="admin"){
    $("screen").innerHTML=`<div class="card" style="text-align:center;padding:26px 18px;">
      <div style="font-size:46px;">👋</div><h2 style="font-size:25px;margin:8px 0;">You're ready to go, ${esc(name)}!</h2>
      <div class="muted">You're added as a player. Finish setting up your first game.</div>
      <div class="notice" style="text-align:left;margin-top:18px;"><b>1. ⛳ Set up your first round</b><br>Add the course, date, competition and optional stake.</div>
      <button class="primary full" onclick="document.querySelector('nav').style.display='';show('round')">⛳ Set Up First Round</button>
      <div class="notice" style="text-align:left;margin-top:18px;"><b>2. 👥 Invite your players</b><br>Once the round is ready, share your group invite so your mates can join.</div>
      <button class="secondary full" onclick="document.querySelector('nav').style.display='';show('players')">👥 Invite Players</button>
    </div>`;
  }else{
    $("screen").innerHTML=`<div class="card" style="text-align:center;padding:26px 18px;">
      <div style="font-size:46px;">👋</div><h2 style="font-size:25px;margin:8px 0;">Welcome to I'm In Golf, ${esc(name)}!</h2>
      <div class="muted">You're now part of <b>${esc(state.groupName||"your golf group")}</b>.</div>
      <div class="notice" style="text-align:left;margin-top:18px;">Your Admin will set up the rounds.<br><br><b>💷 Pay → ⛳ Play → ✍️ Enter your score</b><br><br>Everyone in the group sees the same game.</div>
      <button class="primary full" onclick="document.querySelector('nav').style.display='';show('round')">Got it — take me to the group</button>
    </div>`;
  }
}

function selectMyPlayer(id){
  const player=state.players.find(p=>p.id===id);
  if(!player)return;

  myPlayerId=player.id;
  saveMyPlayerForGroup();

  document.querySelector("nav").style.display="";
  showInstallHelp(player.name);
}
let state={
 course:"Hazel Grove Golf Club",
 date:"Saturday",
 stake:20,
 gameType:"money",
 pointsCompetition:"stableford",
 pointsValue:10,
 players:[
{id:"ga",name:"Greg A",handicap:11,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0},
{id:"gr",name:"Greg R",handicap:14,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0},
{id:"to",name:"Tony",handicap:16,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0},
{id:"bi",name:"Billy",handicap:18,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0}
   ],
 history:[]
};

const $=id=>document.getElementById(id);
function configured(){return window.TENS_IN_CONFIG && TENS_IN_CONFIG.supabaseUrl && !TENS_IN_CONFIG.supabaseUrl.includes("PASTE_")}
window.addEventListener("load",()=>{
  if(!configured()) $("configMissing").classList.remove("hidden");

  const urlPin=new URLSearchParams(window.location.search).get("pin");
  const saved=localStorage.getItem("tensInPin");

  if(urlPin){
    $("pinInput").value=urlPin;
    connect();
  }else if(saved){
    $("pinInput").value=saved;
  }
});

async function connect(){
 if(!configured()){ $("connectMsg").textContent="Please complete the one-time database setup first."; return; }
 pin=$("pinInput").value.trim(); if(!pin){$("connectMsg").textContent="Enter your group PIN.";return}
 $("connectMsg").textContent="Opening shared group…";
 db=supabase.createClient(TENS_IN_CONFIG.supabaseUrl,TENS_IN_CONFIG.supabaseKey);

 const {data:accessRows,error:accessError}=await db.rpc(
   "get_group_access_status",
   {p_pin:pin}
 );
 if(accessError){
   $("connectMsg").textContent="Couldn't check group access. Please try again.";
   return;
 }

 const access=Array.isArray(accessRows) ? accessRows[0] : accessRows;

 if(!access){
   $("connectMsg").textContent="PIN not recognised.";
   return;
 }

 if(access.access_allowed===false){
   clearInterval(poller);
   poller=null;

   $("setupOverlay").classList.add("hidden");
   document.querySelector("nav").style.display="none";
   $("syncText").textContent="Group access unavailable";

   if(access.access_reason==="trial_expired"){
     $("screen").innerHTML=`
       <div class="card" style="text-align:center;margin-top:18px;">
         <div style="font-size:42px;margin-bottom:8px;">⏳</div>
         <h2>Your free trial has ended</h2>
         <p class="muted">${esc(access.group_name||"This group")}'s free trial has finished.</p>
         <div class="notice">
           <b>Continue with I'm In Golf for £19.99 per year.</b><br>
           Annual subscription payment will be available here soon.
         </div>
         <button class="secondary full" onclick="location.reload()">
           ← Use a different Group PIN
         </button>
       </div>`;
   }else{
     $("screen").innerHTML=`
       <div class="card" style="text-align:center;margin-top:18px;">
         <div style="font-size:42px;margin-bottom:8px;">🔒</div>
         <h2>Group access suspended</h2>
         <p class="muted">${esc(access.group_name||"This group")} is currently suspended.</p>
         <div class="notice warning">
           Please contact the I'm In Golf administrator if you believe this is a mistake.
         </div>
         <button class="secondary full" onclick="location.reload()">
           ← Use a different Group PIN
         </button>
       </div>`;
   }
   return;
 }

 const {data,error}=await db.rpc("get_group_state",{p_pin:pin});
 if(error || !data){$("connectMsg").textContent="PIN not recognised, or database setup is incomplete.";return}
state=data;
if(!state.groupName && access?.group_name) state.groupName=String(access.group_name);
localStorage.setItem("tensInPin",pin);
loadMyPlayerForGroup();
loadAdminForGroup();

// Opening a live group counts as activity, so legacy groups gain a persistent
// Last Activity value as soon as someone next uses them.
if(!demoReadOnly()){
  state.lastActivityAt=new Date().toISOString();
  await db.rpc("save_group_state",{p_pin:pin,p_state:state});
}

// Clean up a stale blank round left behind by older Trip Mode versions.
// This only closes an OPEN round when there is no course/date and nobody
// has paid, chosen a competition, or entered a score.
const staleBlankRound =
  state.roundOpen===true &&
  !String(state.course||"").trim() &&
  !String(state.date||"").trim() &&
  (state.players||[]).every(p =>
    !p.paid &&
    p.stableford==null &&
    p.netScore==null &&
    p.noReturn!==true &&
    p.scoreSubmitted!==true
  );

if(staleBlankRound){
  state.roundOpen=false;

  const {error:cleanupError}=await db.rpc(
    "save_group_state",
    {p_pin:pin,p_state:state}
  );

  if(cleanupError){
    console.error("Stale round cleanup could not be saved:",cleanupError);
  }
}
$("demoBadge").classList.toggle("hidden", pin!=="2026");
$("setupOverlay").classList.add("hidden");
$("syncText").textContent="Shared • everyone sees the same game";

const setupTokenFromUrl=
  new URLSearchParams(window.location.search).get("adminsetup");

if(!state.adminPin && setupTokenFromUrl){
  if(String(state.adminSetupToken||"")!==String(setupTokenFromUrl)){
    appAlert("This Admin setup link is no longer valid.");
    return;
  }

  const currentSetupName=String(state.groupName||"My Golf Group").trim() || "My Golf Group";
  state.groupName=await organiserGroupNameSetup(currentSetupName);

  // Keep the chosen display name in the shared group state immediately.
  // The Owner Dashboard reads this same live state, so the renamed group
  // appears everywhere without changing the permanent Group PIN.
  const nameSaved=await save();
  if(!nameSaved){
    appAlert("The group name could not be saved. Please reopen the private setup link and try again.");
    return;
  }

  // Admin setup is intentionally blocking: the organiser cannot continue
  // into the player journey until a valid 4-digit PIN has been created twice.
  const clean=await organiserAdminPinSetup(state.groupName||currentSetupName);

  state.adminPin=clean;
  state.adminSetupToken="";
  const saved=await save();

  if(!saved){
    state.adminPin="";
    appAlert("Admin PIN could not be saved. Please reopen the setup link and try again.");
    return;
  }

  isAdmin=true;
  saveAdminForGroup();
  history.replaceState({},document.title,location.pathname+"?pin="+encodeURIComponent(pin));
  const setupPaymentLink=await organiserPaymentSetup(state.groupName||currentSetupName);
  if(setupPaymentLink){
    state.paymentLink=setupPaymentLink;
    await save();
  }
  await organiserAdminSetupComplete(state.groupName||currentSetupName,pin);
}

const existing=state.players.find(p=>p.id===myPlayerId);

if(existing){
  show("round");
}else{
  page="players";
  chooseMyPlayer();
}

startPolling();
 }
async function save(){

  if(!db)return;

  if(demoReadOnly()){
    $("syncText").textContent="Demo • read only";
    return false;
  }

  $("syncText").textContent="Saving…";

  // Persist meaningful group activity for the Owner Dashboard.
  state.lastActivityAt=new Date().toISOString();

  const {data,error}=await db.rpc(
    "save_group_state",
    {p_pin:pin,p_state:state}
  );

  $("syncText").textContent=
    error ? "Couldn't sync" : "Shared • synced";

  return !error;
}
async function refresh(){
 if(!db)return;

 // Never redraw while someone is typing a score draft.
 // This prevents the 5-second sync from wiping or replacing an unsent score.
 if(scoreDraftActive)return;

 // Keep Owner utility screens on display.
 // Do not let the 5-second background sync redraw them while they are open.
 if(page==="admininvite" || page==="managegroups" || page==="editgroup" || page==="adminhelp")return;

 const editing=document.activeElement &&
   document.activeElement.tagName==="INPUT";

 if(editing)return;

 const {data,error}=await db.rpc("get_group_state",{p_pin:pin});
if(!error && data){
  state=data;

  // Only redraw the app if this phone's saved player still exists
  // in the current group. This prevents "Find my name" from being
  // replaced by the join screen every 5 seconds when a stale player
  // ID is stored from another group.
  const currentPlayerExists=
    myPlayerId && state.players.some(p=>p.id===myPlayerId);

  if(currentPlayerExists){
    render();
  }

  $("syncText").textContent=
  demoReadOnly() ? "Demo • read only" : "Shared • synced";
}

 }
let scoreDraftActive=false;
function startPolling(){ clearInterval(poller); poller=setInterval(refresh,5000); }
function show(p){
  scoreDraftActive=false;
  page=p;
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  $("n"+p)?.classList.add("active");
  render();
}
function render(){
  updateAdminUI();

  if(page==="round")round();
  if(page==="pay")pay();
  if(page==="scores")scores();
  if(page==="league")league();
  if(page==="playerstats" && statsPlayerId)showPlayerStats(statsPlayerId);
  if(page==="players")playersPage();
  if(page==="settings")settingsPage();
  if(page==="admininvite")adminInvitePage();
  if(page==="managegroups")manageGroupsPage();
  if(page==="editgroup")editGroupPage();
  if(page==="tripsummary")showTripSummary();
  if(page==="adminhelp")adminHelpPage();
}
function roundLocked(){
  return state.players.some(p=>
    p.stableford!=null ||
    p.netScore!=null ||
    p.noReturn===true
  );
}

function roundOpenNow(){
  if(state.roundOpen===false)return false;
  if(state.roundOpen===true)return true;

  // Backward-compatible check for groups that completed a round before
  // the roundOpen flag existed. If the latest saved round matches the
  // current round and all entries have already been reset, treat it as closed.
  const last=(state.history||[])[0];
  const noLiveEntries=(state.players||[]).every(p=>
    !p.paid &&
    p.stableford==null &&
    p.netScore==null &&
    p.noReturn!==true
  );

  if(last && noLiveEntries){
    const sameCourse=String(last.course||"")===String(state.course||"");
    const sameDate=String(last.date||"")===String(state.date||"");
    if(sameCourse && sameDate)return false;
  }

  return true;
}

  return !state.trip?.active &&

function paidCount(){return state.players.filter(p=>p.paid).length}
function potentialPot(){return Number(state.stake||0)*state.players.length}
function pot(){return Number(state.stake||0)*paidCount()}
function stablefordPaidCount(){
  return (state.pointsCompetition || "stableford")==="stableford"
    ? state.players.filter(p=>p.paid).length
    : 0;
}

function netPaidCount(){
  return (state.pointsCompetition || "stableford")==="net"
    ? state.players.filter(p=>p.paid).length
    : 0;
}

function stablefordPot(){
  return Number(state.stake||0)*stablefordPaidCount();
}

function netPot(){
  return Number(state.stake||0)*netPaidCount();
}
function tripRoundRanking(record, competition){
  const comp=competition || state.trip?.competition || "stableford";
  const rows=(record?.players||[]).map(p=>({
    name:p.name,
    score:comp==="net" ? (p.netScore==null?null:Number(p.netScore)) : (p.stableford==null?null:Number(p.stableford)),
    noReturn:Boolean(p.noReturn)
  })).filter(x=>x.score!=null || x.noReturn);

  rows.sort((a,b)=>{
    if(a.noReturn!==b.noReturn)return a.noReturn?1:-1;
    if(a.score==null && b.score==null)return a.name.localeCompare(b.name);
    if(a.score==null)return 1;
    if(b.score==null)return -1;
    const d=comp==="net" ? a.score-b.score : b.score-a.score;
    return d || a.name.localeCompare(b.name);
  });

  let lastScore=null, lastRank=0;
  return rows.map((r,i)=>{
    let rank=null;
    if(!r.noReturn && r.score!=null){
      if(lastScore===null || r.score!==lastScore){ lastRank=i+1; lastScore=r.score; }
      rank=lastRank;
    }
    const tied=rank!=null && rows.filter(x=>!x.noReturn && x.score===r.score).length>1;
    return {...r,rank,rankLabel:rank==null?"NR":(tied?"T"+rank:String(rank))};
  });
}

function tripAggregate(trip){
  trip=trip||state.trip||{};
  const rounds=trip.rounds||[];
  const comp=trip.competition||"stableford";
  const liveNames=(trip===state.trip) ? state.players.map(p=>p.name) : [];
  const names=[...new Set([
    ...liveNames,
    ...rounds.flatMap(r=>(r.players||[]).map(p=>p.name))
  ])];
  const rows=names.map(name=>{
    let total=0, played=0, hasNR=false;
    const roundScores=[];
    rounds.forEach(r=>{
      const p=(r.players||[]).find(x=>x.name===name);
      if(!p){ roundScores.push(null); return; }
      if(p.noReturn===true){ hasNR=true; roundScores.push("NR"); return; }
      const score=comp==="net" ? p.netScore : p.stableford;
      if(score==null){ roundScores.push(null); return; }
      const n=Number(score); total+=n; played+=1; roundScores.push(n);
    });
    return {name,total,played,hasNR,roundScores};
  });
  rows.sort((a,b)=>{
    const aComplete=a.played===rounds.length && !a.hasNR;
    const bComplete=b.played===rounds.length && !b.hasNR;
    if(aComplete!==bComplete)return aComplete?-1:1;
    if(a.hasNR!==b.hasNR)return a.hasNR?1:-1;
    if(a.played!==b.played)return b.played-a.played;
    const d=comp==="net" ? a.total-b.total : b.total-a.total;
    return d || a.name.localeCompare(b.name);
  });
  return rows;
}

function rebuildTripStandings(trip){
  if(!trip)return;
  const rows=tripAggregate(trip);
  trip.standings={};
  rows.forEach(r=>{ trip.standings[r.name]=r.hasNR ? null : r.total; });
}

function tripStandingsSorted(){
  return tripAggregate(state.trip).map(r=>({name:r.name,points:r.total,played:r.played,hasNR:r.hasNR,roundScores:r.roundScores}));
}

function tripRoundWinner(record){
  if(!record)return null;

  if(record.gameType==="points"){
    const first=(record.pointsResults||[])[0];
    if(!first)return null;
    return {
      name:first.name,
      score:record.pointsCompetition==="net"
        ? "Net " + first.score
        : first.score + " pts",
      label:record.pointsCompetition==="net" ? "Net" : "Stableford"
    };
  }

  const comp=state.trip?.competition || "stableford";

  if(comp==="net"){
    const names=record.netWinnerNames||[];
    if(!names.length)return null;
    const p=(record.players||[]).find(x=>x.name===names[0]);
    return {
      name:names.join(" & "),
      score:p?.noReturn===true ? "NR" : (p?.netScore!=null ? "Net "+p.netScore : ""),
      label:"Net"
    };
  }

  const names=record.stablefordWinnerNames||[];
  if(!names.length)return null;
  const p=(record.players||[]).find(x=>x.name===names[0]);
  return {
    name:names.join(" & "),
    score:p?.stableford!=null ? p.stableford+" pts" : "",
    label:"Stableford"
  };
}

function beginPlayerPayment(){

async function recognisePaymentReturn(){
  if(paymentReturnBusy || document.visibilityState==="hidden")return;
  let journey=null;
  try{journey=JSON.parse(sessionStorage.getItem(paymentReturnKey())||"null");}catch(e){}
  if(!journey || !journey.playerId || Date.now()-Number(journey.startedAt||0)<1200)return;
  const player=state.players.find(p=>p.id===journey.playerId);
  sessionStorage.removeItem(paymentReturnKey());
  if(!player || player.paid || roundLocked())return;
  paymentReturnBusy=true;
  player.paid=true;
  player.paymentMarkedAt=new Date().toISOString();
  player.paymentMarkMethod="payment-link-return";
  await save();
  paymentReturnBusy=false;
  render();

}

async function setCompetition(i,type){
if(!demoCanEdit())return;
  const p=state.players[i];

  if(!isAdmin && p.id!==myPlayerId)return;

  if(state.gameType==="money" && Number(state.stake||0)>0 && !p.paid){
    appAlert("Pay before choosing Stableford or Net.");
    return;
  }

  if(roundLocked() && !isAdmin){
    appAlert("🔒 Entries are closed — scoring has started.");
    return;
  }

  if(roundLocked() && isAdmin && (p.scoreSubmitted===true || p.stableford!=null || p.netScore!=null || p.noReturn===true)){
    appAlert("This player has already submitted. Use Correct score if a change is needed.");
    return;
  }

  p.competition=type;

  render();
  await save();
}
async function submitPlayerScore(i,type){
  if(!demoCanEdit())return;
  type=state.pointsCompetition||type||"stableford";

  const p=state.players[i];
  if(!p)return;
  if(!isAdmin && p.id!==myPlayerId)return;

  if(state.gameType==="money" && Number(state.stake||0)>0 && !p.paid){
    appAlert("Pay before entering a score.");
    return;
  }

  const input=$("scoreInput_"+i);
  const raw=String(input?.value||"").trim();
  const value=Number(raw);

  if(!raw || !Number.isFinite(value) || value<0){
    appAlert("Please enter a valid score.");
    return;
  }

  const label=type==="stableford"
    ? "Stableford score " + value + " points"
    : "Net score " + value;

  if(!await appConfirm("Submit " + label + "?\n\nAre you sure?"))return;

  if(type==="stableford"){
    p.stableford=value;
    p.netScore=null;
  }else{
    p.netScore=value;
    p.stableford=null;
  }

  p.noReturn=false;
  p.scoreSubmitted=true;
  scoreDraftActive=false;

  render();
  await save();
}

async function submitNoReturn(i){
  if(!demoCanEdit())return;

  const p=state.players[i];
  if(!p)return;
  if(!isAdmin && p.id!==myPlayerId)return;

  const type=state.pointsCompetition||"stableford";

  if(type!=="net"){

async function adminEditSubmittedScore(i,type){
  if(!isAdmin || !demoCanEdit())return;

  const p=state.players[i];
  if(!p)return;

  const current=p.noReturn===true
    ? "NR"
    : type==="stableford"
    ? String(p.stableford??"")
    : String(p.netScore??"");

  const answer=await appPrompt(
    "Correct " + p.name + "'s submitted " +
    (type==="stableford" ? "Stableford score" : "Net score") +
    (type==="net" ? ".\n\nEnter a number or NR." : "."),
    current
  );

  if(answer===null)return;

  const clean=String(answer).trim().toUpperCase();

  if(type==="net" && clean==="NR"){
    if(!await appConfirm("Change " + p.name + "'s result to NR — No Return?"))return;
    p.netScore=null;
    p.stableford=null;
    p.noReturn=true;
    p.scoreSubmitted=true;
    render();
    await save();
    return;
  }

  const value=Number(clean);
  if(clean==="" || !Number.isFinite(value) || value<0){
    appAlert("Please enter a valid score" + (type==="net" ? " or NR." : "."));
    return;
  }

  if(!await appConfirm("Change " + p.name + "'s submitted score to " + value + "?"))return;

  if(type==="stableford"){
    p.stableford=value;
    p.netScore=null;
  }else{
    p.netScore=value;
    p.stableford=null;
  }

  p.noReturn=false;
  p.scoreSubmitted=true;

  render();
  await save();
}

async function finishRound(){

  const isPointsGame=state.gameType==="points";
  const pointsComp=state.pointsCompetition || "stableford";
  const isTrip=Boolean(state.trip?.active);

  async function chooseCountbackWinner(players,competition,score,position){
    const names=players.map((p,i)=>`${i+1}. ${p.name}`).join("\n");

    const answer=await appPrompt(
      `${competition} tie for ${position} on ${score}.\n\n` +
      `Use your normal scorecard countback and choose the winner.\nNo hole-by-hole entry is needed in the app.\n\n` +
      names +
      `\n\nEnter the player's number.`
    );

    if(answer===null)return null;

    const selected=Number(answer)-1;

    if(selected<0 || selected>=players.length){
      appAlert("Please choose one of the listed players.");
      return await chooseCountbackWinner(
        players,
        competition,
        score,
        position
      );
    }

    return players[selected];
  }

  function chooseMoneyCountbackWinner(players,competition,score){
    return new Promise(resolve=>{
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;";
      overlay.innerHTML=`
        <div class="card" style="width:min(440px,100%);margin:0;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
          <div style="font-size:38px;text-align:center;">🏆</div>
          <h2 style="text-align:center;margin:8px 0;">Choose countback winner</h2>
          <div class="notice" style="margin-top:14px;">
            <b>${esc(competition)} tie — ${esc(String(score))}</b><br>
            Use your normal scorecard countback. No hole-by-hole entry is needed in I'm In Golf.
          </div>
          <div style="margin-top:14px;">
            ${players.map((p,i)=>`
              <button class="primary full" data-winner="${i}" style="margin-top:${i?8:0}px;">
                🏆 ${esc(p.name)}
              </button>
            `).join("")}
          </div>
          <button class="secondary full" id="cancelCountbackWinner" style="margin-top:12px;">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelectorAll("[data-winner]").forEach(btn=>{
        btn.onclick=()=>{
          const winner=players[Number(btn.dataset.winner)];
          overlay.remove();
          resolve(winner || null);
        };
      });
      overlay.querySelector("#cancelCountbackWinner").onclick=()=>{
        overlay.remove();
        resolve(null);
      };
    });
  }

  function resolveMoneyTie(players,competition,score,pot){
    return new Promise(resolve=>{
      const each=players.length ? Number(pot||0)/players.length : 0;
      const money=n=>Number(n||0).toFixed(2).replace(/\.00$/,"" );
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;";
      overlay.innerHTML=`
        <div class="card" style="width:min(440px,100%);margin:0;padding:24px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);">
          <div style="font-size:40px;text-align:center;">🤝</div>
          <h2 style="text-align:center;margin:8px 0;">Tied winning score</h2>
          <div class="notice" style="margin-top:14px;">
            <b>${esc(competition)} — ${esc(String(score))}</b><br>
            ${players.map(p=>esc(p.name)).join(" & ")} are tied for 1st.
          </div>
          <p style="font-weight:800;margin:18px 0 8px;">How would you like to settle it?</p>
          <button class="primary full" id="splitTiePot">
            💷 Split the pot — £${money(each)} each
          </button>
          <button class="secondary full" id="countbackTieWinner" style="margin-top:10px;">
            🏆 Choose winner — countback
          </button>
          <button class="ghost full" id="cancelMoneyTie" style="margin-top:10px;">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector("#splitTiePot").onclick=()=>{
        overlay.remove();
        resolve({winners:[...players],countback:false,split:true});
      };

      overlay.querySelector("#countbackTieWinner").onclick=async()=>{
        overlay.remove();
        const winner=await chooseMoneyCountbackWinner(players,competition,score);
        resolve(winner ? {winners:[winner],countback:true,split:false} : null);
      };

      overlay.querySelector("#cancelMoneyTie").onclick=()=>{
        overlay.remove();
        resolve(null);
      };
    });
  }


  // =====================================
  // 🏆 POINTS GAME
  // =====================================

  if(isPointsGame){

    const scoredPlayers=state.players.filter(p=>
      pointsComp==="stableford"
        ? p.stableford!=null
        : p.netScore!=null
    );

    if(!scoredPlayers.length){
      appAlert(
        pointsComp==="stableford"
          ? "Enter at least one Stableford score first."
          : "Enter at least one Net score first."
      );
      return;
    }

    let remaining=[...scoredPlayers];

    const places=[];
    const placeNames=["1st","2nd","3rd"];

    for(let place=0; place<3 && remaining.length; place++){

      const bestScore=
        pointsComp==="stableford"
          ? Math.max(...remaining.map(p=>Number(p.stableford)))
          : Math.min(...remaining.map(p=>Number(p.netScore)));

      const tied=remaining.filter(p=>
        pointsComp==="stableford"
          ? Number(p.stableford)===bestScore
          : Number(p.netScore)===bestScore
      );

      let selectedPlayer=tied[0];
      let countback=false;

      if(state.gameType==="points" && (tied.length>1)){

        selectedPlayer=await chooseCountbackWinner(
          tied,
          pointsComp==="stableford" ? "Stableford" : "Net",
          pointsComp==="stableford"
            ? bestScore + " points"
            : bestScore,
          placeNames[place]
        );

        if(!selectedPlayer)return;

        countback=true;
      }

      places.push({
        name:selectedPlayer.name,
        score:
          pointsComp==="stableford"
            ? Number(selectedPlayer.stableford)
            : Number(selectedPlayer.netScore),
        position:place+1,
        countback:countback
      });

      remaining=remaining.filter(p=>p!==selectedPlayer);
    }

    const firstPoints=Number(state.pointsValue||10);
    const secondPoints=Math.round(firstPoints*0.6);
    const thirdPoints=Math.round(firstPoints*0.3);

    const pointsAwards=[
      firstPoints,
      secondPoints,
      thirdPoints
    ];
places.forEach((place,i)=>{
  place.points=pointsAwards[i];

  if(isTrip){

    state.trip.standings=state.trip.standings || {};

    state.trip.standings[place.name]=

    return total+won;

  },0);
};

      <button class="primary full" id="joinSubmit">Join Group</button><button class="ghost full" id="joinCancel">Cancel</button>
    </div>`;
    document.body.appendChild(overlay);
    const msg=overlay.querySelector("#joinMsg");
    overlay.querySelector("#joinCancel").onclick=()=>{overlay.remove();resolve(null)};
    overlay.querySelector("#joinSubmit").onclick=()=>{
      const first=overlay.querySelector("#joinFirst").value.trim();
      const surname=overlay.querySelector("#joinSurname").value.trim();
      const handicap=Number(overlay.querySelector("#joinHandicap").value);

      overlay.remove();resolve({first,surname,handicap});
    };

  });

  const newPlayer={id:Date.now().toString(36),name:cleanName,handicap:details.handicap,competition:null,paid:false,stableford:null,netScore:null,noReturn:false,scoreSubmitted:false,wins:0,leaguePoints:0,netWinnings:0};
  state.players.push(newPlayer); myPlayerId=newPlayer.id; saveMyPlayerForGroup();
  pendingFirstWelcome=isAdmin?"admin":"player";

async function adminAddPlayer(){

  if(firstName===null)return;

    appAlert("Please enter the player's first name and surname.");

  }

  }

  const handicap=Number(h);
  if(!Number.isFinite(handicap) || handicap < -10 || handicap > 60){
    appAlert("Please enter a valid handicap between -10 and 60.");

  }

    scoreSubmitted:false,

async function changeCurrentRoundCompetition(){
  if(!isAdmin)return;
  if(!roundOpenNow()){
    appAlert("There is no open round to change.");
    return;
  }
  if(roundLocked()){
    appAlert("Competition cannot be changed after scoring has started.");
    return;
  }
  const current=(state.pointsCompetition||"stableford")==="net" ? "net" : "stableford";
  const next=current==="stableford" ? "net" : "stableford";
  const currentLabel=current==="stableford" ? "Stableford" : "Net";
  const nextLabel=next==="stableford" ? "Stableford" : "Net";
  if(!await appConfirm(`Change this round from ${currentLabel} to ${nextLabel}?\n\nPlayers, payments, course, date and stake will stay unchanged.`))return;
  state.pointsCompetition=next;
  // Keep legacy per-player competition data aligned where no score has been submitted.
  state.players.forEach(p=>{
    if(p.stableford==null && p.netScore==null && p.noReturn!==true){
      p.competition=next;
    }
  });
  await save();
  appAlert(`✅ Competition changed to ${nextLabel}.`);
  settingsPage();
}

async function deleteOwnerGroup(groupPin){

  if(!db || !isAdmin || !isOwner || !ownerCreationCode){
    appAlert("I'm In Golf Owner access required.");
    return;
  }

  const cleanPin=String(groupPin||"");

  if(cleanPin==="1010"){
    appAlert("🔐 The Owner group cannot be deleted.");
    return;
  }

  const g=ownerGroups.find(
    x=>String(x.group_pin)===cleanPin
  );

  if(!g){
    appAlert("Group could not be found.");
    return;
  }

  const groupName=String(g.group_name||"Unnamed Group");

  const firstConfirm=await appConfirm(
    "🗑️ Delete " + groupName + "?\n\n" +
    "Group PIN: " + cleanPin + "\n\n" +
    "This permanently removes this group and its saved group data.\n\n" +
    "This cannot be undone."
  );

  if(!firstConfirm)return;

  const typed=await appPrompt(
    "Final confirmation\n\n" +
    "Type the Group PIN " + cleanPin + " to permanently delete " + groupName + "."
  );

  if(typed===null)return;

  if(String(typed).trim()!==cleanPin){
    appAlert("Group PIN did not match. Nothing was deleted.");
    return;
  }

  const {error}=await db.rpc(
    "owner_delete_group",
    {
      p_creation_code:ownerCreationCode,
      p_group_pin:cleanPin
    }
  );

  if(error){
    appAlert(
      "Group could not be deleted.\n\n" +
      (error.message||"Please try again.")
    );
    return;
  }

  appAlert("✅ " + groupName + " deleted.");
  await manageGroupsPage();
}

async function ownerResetAdminPin(){
  if(!db || !isAdmin || !isOwner || !ownerCreationCode){
    appAlert("I'm In Golf Owner access required.");
    return;
  }

  const groupPin=String(ownerEditGroupPin||"");
  if(!groupPin){
    appAlert("Group could not be identified.");
    return;
  }

  const first=await appPrompt("Choose a new 4-digit Admin PIN for group " + groupPin);
  if(first===null)return;

  const clean=String(first).trim();
  if(!validAdminPin(clean)){
    appAlert("Please choose exactly 4 numbers.");
    return;
  }

  const second=await appPrompt("Enter the new 4-digit Admin PIN again");
  if(second===null)return;

  if(String(second).trim()!==clean){
    appAlert("The two PINs did not match.");
    return;
  }

  const ok=await appConfirm("Reset the Admin PIN for group " + groupPin + "?");
  if(!ok)return;

  const {data,error}=await db.rpc(
    "owner_reset_admin_pin",
    {
      p_creation_code:ownerCreationCode,
      p_group_pin:groupPin,
      p_new_admin_pin:clean
    }
  );

  if(error || data!==true){
    appAlert(
      "Admin PIN could not be reset.\n\n" +
      (error?.message || "Please try again.")
    );
    return;
  }

  if(groupPin===String(pin)){
    state.adminPin=clean;
    state.adminSetupToken="";
  }

  appAlert("✅ Admin PIN reset for group " + groupPin + ".");
}

async function saveOwnerGroupEdit(){
  if(!db || !isOwner || !ownerCreationCode)return;

  const g=ownerGroups.find(x=>String(x.group_pin)===String(ownerEditGroupPin));
  if(!g)return;

  const protectedGroup=String(g.group_pin)==="1010";

  const args={
    p_creation_code:ownerCreationCode,
    p_group_pin:String(g.group_pin),
    p_admin_name:$("ownerAdminName").value.trim(),
    p_admin_contact:$("ownerAdminContact").value.trim(),
    p_plan_type:protectedGroup ? "internal" : $("ownerPlanType").value,
    p_trial_expiry_date:$("ownerTrialExpiry").value || null,
    p_paid_status:$("ownerPaidStatus").value,
    p_renewal_date:$("ownerRenewalDate").value || null,
    p_status:protectedGroup ? "active" : $("ownerGroupStatus").value,
    p_notes:$("ownerNotes").value.trim()
  };

  const saveButton=document.querySelector('#screen button.primary');
  if(saveButton){
    saveButton.disabled=true;
    saveButton.textContent="Saving…";
  }

  const {error}=await db.rpc("owner_update_group",args);

  if(error){
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent="💾 Save Changes";
    }
    appAlert("Group changes could not be saved.\n\n" + (error.message||"Please try again."));
    return;
  }

  appAlert("✅ Group details updated.");
  ownerEditGroupPin="";
  await manageGroupsPage();
}

function formatOwnerDate(value){
  if(!value)return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function normalisePaymentLink(value){

}

async function cancelCurrentRound(){
  if(!isAdmin){
    appAlert("🔒 Only the group Admin can cancel the current round.");
    return;
  }

  if(state.trip?.active){
    appAlert("Use Cancel Current Trip for an active trip.");
    return;
  }

  const hasRoundSetup=
    Boolean(String(state.course||"").trim()) ||
    Boolean(state.date) ||
    state.players.some(p=>
      p.paid ||
      p.scoreSubmitted ||
      p.stableford!=null ||
      p.netScore!=null ||
      p.noReturn===true ||
      Boolean(p.competition)
    );

  if(!hasRoundSetup){
    appAlert("There is no current round to cancel.");
    return;
  }

  if(!await appConfirm(
    "Cancel the current round?\n\n" +
    "This clears only the current round setup, payments, competition choices and scores.\n\n" +
    "Players, league standings and previous-round history will NOT be deleted."
  ))return;

  state.course="";
  state.date="";
  state.gameType="money";
  state.pointsCompetition="stableford";
  state.pointsValue=10;
  state.roundOpen=false;

  state.players.forEach(p=>{
    p.paid=false;
    p.competition=null;
    p.stableford=null;
    p.netScore=null;
    p.noReturn=false;
    p.scoreSubmitted=false;
  });

  scoreDraftActive=false;

  const ok=await save();
  if(!ok){
    appAlert("The current round could not be cancelled. Please try again.");
    return;
  }

  appAlert("✅ Current round cancelled. League and history were kept.");
  show("round");
}

}

  if(!isAdmin){
    appAlert("🔒 Only the group Admin can set up the next competition.");
    return;
  }

  const choice=await chooseNewRoundGameType();
  if(choice===null)return;

  if(choice==="3"){
    const setup=await tripSetupScreen();
    if(!setup)return;
    const first=setup.rounds[0];
    state.trip={
      active:true,
      name:setup.name,
      totalRounds:setup.totalRounds,
      currentRound:1,
      competition:setup.competition,
      plan:setup.rounds,
      normalRoundBackup:{
        course:state.course,
        date:state.date,
        stake:state.stake,
        gameType:state.gameType,
        pointsCompetition:state.pointsCompetition,
        pointsValue:state.pointsValue,
        roundOpen:roundOpenNow(),
        players:state.players.map(p=>({
          id:p.id,name:p.name,handicap:p.handicap,paid:p.paid,
          competition:p.competition||null,stableford:p.stableford,netScore:p.netScore,
          noReturn:Boolean(p.noReturn),scoreSubmitted:Boolean(p.scoreSubmitted),
          wins:p.wins||0,leaguePoints:p.leaguePoints||0,netWinnings:p.netWinnings||0
        }))
      },
      rounds:[],standings:{},champion:null,completed:false,
      pastTrips:state.trip?.pastTrips||[]
    };
    state.roundOpen=true;
    state.course=first.course;
    state.date=first.date;
    state.gameType="money";
    state.stake=Number(first.stake||0);
    state.pointsCompetition=setup.competition;
    state.pointsValue=10;
    state.players.forEach(p=>{
      p.paid=false;p.stableford=null;p.netScore=null;p.noReturn=false;p.scoreSubmitted=false;p.competition=null;
    });
    await save();
    show('round');
    return;
  }

  const selectedType=choice==="2" ? "points" : "money";
  const selectedCompetition=await chooseRoundCompetition("Choose competition");
  if(selectedCompetition===null)return;
  const setup=await normalRoundSetup(selectedType,selectedCompetition);
  if(!setup)return;

  if(state.trip) state.trip.active=false;
  state.roundOpen=true;
  state.course=setup.course;
  state.date=setup.date;
  state.gameType=selectedType;
  state.pointsCompetition=selectedCompetition;
  state.pointsValue=10;
  state.stake=selectedType==='money'?Number(setup.stake||0):0;
  state.players.forEach(p=>{
    p.paid=false;p.stableford=null;p.netScore=null;p.noReturn=false;p.scoreSubmitted=false;p.competition=null;
  });
  await save();
  show('round');
}

  const plannedRound=Array.isArray(state.trip.plan) ? state.trip.plan[roundNumber-1] : null;
  if(plannedRound){
    state.roundOpen=true;
    state.course=plannedRound.course || "";
    state.date=plannedRound.date || "";

      p.netScore=null;
      p.noReturn=false;
      p.scoreSubmitted=false;
      p.competition=null;
    });

    show("round");
    return;
  }

// Trip Round date
const tripDate=await pickTripDate(

);

if(tripDate===null)return;

async function deletePastTrip(){

  const pastTrips=state.trip?.pastTrips || [];

  if(!pastTrips.length){
    appAlert("There are no past trips to delete.");
    return;
  }

  const names=pastTrips.map((t,i)=>
    (i+1) + ". " + (t.name || "Unnamed Trip")
  ).join("\n");

  const answer=await appPrompt(
    "Delete which past trip?\n\n" +
    names +
    "\n\nEnter the trip number."
  );

  if(answer===null)return;

  const index=Number(answer)-1;

  if(index<0 || index>=pastTrips.length){
    appAlert("Please enter a valid trip number.");
    return;
  }

  const tripName=pastTrips[index].name || "Trip";

  if(!await appConfirm(
    "Delete " + tripName + "?\n\n" +
    "This removes only this past Trip.\n\n" +
    "Normal leagues, players and current round will not be changed."
  ))return;

  pastTrips.splice(index,1);

  state.trip.pastTrips=pastTrips;

  await save();
  render();

  appAlert(tripName + " deleted.");
}
async function finishTrip(){

  if(!state.trip?.completed){
    appAlert("The Trip is not complete yet.");
    return;
  }

  const tripName=state.trip.name || "Trip";

  if(!await appConfirm(
    "🏁 Finish " + tripName + "?\n\n" +
    "The completed Trip and final standings will be saved.\n\n" +
    "Your normal round will then be restored."
  ))return;

  // Find the normal round backup
  const backup=
    state.trip?.normalRoundBackup ||
    state.trip?.pastTrips?.[0]?.normalRoundBackup;

  if(!backup){
    appAlert(
      "Normal round backup could not be found.\n\n" +
      "The Trip has not been closed."
    );
    return;
  }

  // Keep existing archived trips separate
  const existingPastTrips=[
    ...(state.trip?.pastTrips || [])
  ];

  // Create a clean completed Trip copy.
  // IMPORTANT: do not copy pastTrips into itself.
  const completedTrip={
    name:state.trip.name,
    totalRounds:state.trip.totalRounds,
    currentRound:state.trip.currentRound,
    competition:state.trip.competition,
    tripPointsValue:state.trip.tripPointsValue,
    rounds:[...(state.trip.rounds || [])],
    standings:{...(state.trip.standings || {})},
    champion:state.trip.champion || tripStandingsSorted()[0]?.name || null,
    completed:true,
    active:false,
    normalRoundBackup:state.trip.normalRoundBackup || backup
  };

  const pastTrips=[
    completedTrip,
    ...existingPastTrips
  ];

  // Return cleanly to normal golf after the Trip.
  // Keep the normal defaults/players, but do not reopen a stale or blank round.
  state.course=backup.course || "";
  state.date="";
  state.stake=backup.stake;
  state.gameType=backup.gameType || "points";
  state.pointsCompetition=backup.pointsCompetition || "stableford";
  state.pointsValue=backup.pointsValue || 10;
  state.roundOpen=false;

  state.players=backup.players.map(p=>({
    id:p.id,
    name:p.name,
    handicap:p.handicap,
    paid:false,
    competition:null,
    stableford:null,
    netScore:null,
    noReturn:false,
    scoreSubmitted:false,
    wins:p.wins,
    leaguePoints:p.leaguePoints,
    netWinnings:p.netWinnings
  }));

  // Trip Mode is now closed,
  // but completed Trips remain archived.
  state.trip={
    active:false,
    name:"",
    totalRounds:0,
    currentRound:0,
    competition:null,
    tripPointsValue:10,
    rounds:[],
    standings:{},
    champion:null,
    completed:false,
    pastTrips:pastTrips
  };

  await save();
  show("round");

  appAlert(
    "🏁 " + tripName + " saved.\n\n" +
    "You're ready to set up the next competition."
  );
}

};

await save();
show("round");

appAlert("Trip cancelled. Your normal round has been restored.");
}

async function deleteLastRound(){
  if(!state.history || !state.history.length){
    appAlert("There are no completed rounds to delete.");
    return;
  }

  const lastRound=state.history[0];

  const winnerNames=(lastRound.winners||[]).join(", ") || "No winner recorded";

  let extraText="";

  if(lastRound.gameType==="points" && lastRound.pointsResults?.length){
    extraText=
      "\n\nPoints to be removed:\n" +
      lastRound.pointsResults.map(r=>
        r.name + " -" + r.points + " pts"
      ).join("\n");
  }

  const deleteMessage=
    "Delete this completed round?\n\n" +
    lastRound.course + " • " + formatDate(lastRound.date) + "\n" +
    "Winner: " + winnerNames +
    extraText +
    "\n\nThis will remove the round and correct the league stats.\n\n" +
    "Are you sure?";

  if(!await appConfirm(deleteMessage))return;

  // Undo winner win
  (lastRound.winners||[]).forEach(name=>{
    const p=state.players.find(x=>x.name===name);

    if(p && (p.wins||0)>0){
      p.wins=p.wins-1;
    }
  });

  // Undo Points Game league points
  if(lastRound.gameType==="points" && lastRound.pointsResults?.length){

    lastRound.pointsResults.forEach(result=>{
      const p=state.players.find(x=>x.name===result.name);

      if(p){
        p.leaguePoints=Math.max(
          0,
          Number(p.leaguePoints||0)-Number(result.points||0)
        );
      }
    });
  }

  state.history.shift();

  render();
  await save();

  appAlert("Last round deleted and league stats corrected.");
}

function ensureAppMessageLayer(){
 let el=document.getElementById("appMessageLayer");
 if(el)return el;
 el=document.createElement("div");
 el.id="appMessageLayer";
 el.style.cssText="position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(8,35,22,.48);backdrop-filter:blur(2px)";
 el.innerHTML=`<div style="width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;border:1px solid #dfe9e3">

   <div style="padding:0 22px 22px"><button class="primary full" onclick="closeAppAlert()">OK</button></div>
 </div>`;

function appModalBase({title="I'm In Golf",message="",input=false,value="",placeholder="",confirmText="OK",cancelText="Cancel",showCancel=false,inputType="text"}={}){
 return new Promise(resolve=>{
   const overlay=document.createElement("div");
   overlay.style.cssText="position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(8,35,22,.48);backdrop-filter:blur(2px)";
   overlay.innerHTML=`<div style="width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;border:1px solid #dfe9e3">
     <div style="background:#126b3a;color:#fff;padding:18px 22px;text-align:center;font-weight:900;font-size:20px;">I'M IN GOLF</div>
     <div style="padding:23px 22px 12px;text-align:center"><div style="font-size:21px;font-weight:900;color:#183326;margin-bottom:10px">${esc(title)}</div><div style="white-space:pre-line;line-height:1.45;font-size:16px;color:#42594d">${esc(message)}</div></div>
     ${input?`<div style="padding:5px 22px 12px"><input id="appModalInput" type="${escAttr(inputType)}" value="${escAttr(value)}" placeholder="${escAttr(placeholder)}" style="width:100%;font-size:18px"></div>`:""}
     <div style="padding:8px 22px 22px;display:grid;gap:9px"><button class="primary full" id="appModalConfirm">${esc(confirmText)}</button>${showCancel?`<button class="secondary full" id="appModalCancel">${esc(cancelText)}</button>`:""}</div>
   </div>`;
   document.body.appendChild(overlay);
   const inp=overlay.querySelector("#appModalInput");
   const done=v=>{overlay.remove();resolve(v)};
   overlay.querySelector("#appModalConfirm").onclick=()=>done(input?(inp?.value??""):true);
   overlay.querySelector("#appModalCancel")?.addEventListener("click",()=>done(input?null:false));
   inp?.addEventListener("keydown",e=>{if(e.key==="Enter")done(inp.value);if(e.key==="Escape")done(null)});
   setTimeout(()=>{if(inp){inp.focus();inp.select();}},20);
 });
}
function modalParts(text){
 const raw=String(text??""); const parts=raw.split(/\n\n/); const title=(parts.shift()||"I'm In Golf").trim(); return {title,message:parts.join("\n\n").trim()};
}
async function appConfirm(message){const p=modalParts(message);return appModalBase({title:p.title,message:p.message,confirmText:"Yes",cancelText:"Cancel",showCancel:true});}
async function appPrompt(message,value=""){const p=modalParts(message);return appModalBase({title:p.title,message:p.message,input:true,value:value??"",confirmText:"Continue",cancelText:"Cancel",showCancel:true});}
function appAlert(message){
 const el=ensureAppMessageLayer();
 const text=document.getElementById("appMessageText");
 if(text)text.textContent=String(message??"");
 el.style.display="flex";
}
function closeAppAlert(){const el=document.getElementById("appMessageLayer");if(el)el.style.display="none";}
function formatDate(d){
 if(!d || !d.includes("-"))return d;
 const [y,m,day]=d.split("-");
 return `${Number(day)}.${Number(m)}.${y.slice(2)}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s)}
