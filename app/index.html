<!doctype html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I'm In Golf</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17231b;--muted:#68736c;--green:#176b3a;--green2:#23864e;--line:#dce3dd;--amber:#8a6500;--amberbg:#fff1c7;--red:#a83b34;--redbg:#fbe4e1}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:76px}
header{background:linear-gradient(135deg,#10592f,#23864e);color:white;padding:calc(24px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:30px} header p{margin:5px 0 0;opacity:.85}
main{padding:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
h2{font-size:18px;margin:0 0 12px}.muted{font-size:13px;color:var(--muted)}.big{font-size:28px;font-weight:800}
.pill{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px}.paid{background:#def4e5;color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.danger{background:var(--redbg);color:var(--red)}
.player{padding:12px 0;border-top:1px solid var(--line)}.player:first-child{border-top:0}
button{border:0;border-radius:12px;padding:11px 13px;font-weight:750;font-size:14px}.primary{background:var(--green);color:white}.secondary{background:#edf4ef;color:var(--green)}.ghost{background:#f3f4f3;color:#536058}.red{background:var(--redbg);color:var(--red)}
.full{width:100%;margin-top:10px}.small{padding:8px 10px;font-size:12px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:white;margin:5px 0 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#edf5ef;padding:11px;border-radius:12px;font-size:13px;margin:10px 0}.warning{background:#fff5dc}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line);display:flex;z-index:20}
nav button{flex:1;background:transparent;color:#6d756f;padding:11px 2px;font-size:13px;line-height:1.35}nav button.active{color:var(--green);font-weight:800}
.score{width:78px;margin:0}.pos{font-weight:800;font-size:18px;min-width:24px}.money{font-weight:800}
#setupOverlay{position:fixed;inset:0;background:#f4f6f3;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:45px 16px;overflow:auto}
.setup{width:min(480px,100%)}.hidden{display:none!important}
</style>
</head>
<body>
<div id="setupOverlay">
 <div class="setup">
  <div class="card">
   <h1 style="margin-top:0">⛳ I'm In Golf</h1>
   <p>Golf. Mates. You're In.</p>
   <div id="configMissing" class="notice warning hidden"><b>One-time setup needed.</b><br>This shared version needs your Supabase project details added to <code>config.js</code>.</div>
   <label><b>Group PIN</b></label>
<input id="pinInput" inputmode="numeric" autocomplete="off" placeholder="Enter your shared PIN">
<button class="primary full" onclick="connect()">Open I'm In Golf</button>
<div id="connectMsg" class="muted" style="margin-top:10px"></div>
     </div>
 </div>
</div>

<div class="app">
<header>
  <h1>
    I'm In Golf ⛳
    <span id="demoBadge" class="hidden" style="
      font-size:12px;
      background:#fff1c7;
      color:#8a6500;
      padding:5px 9px;
      border-radius:999px;
      vertical-align:middle;
      margin-left:6px;
    ">DEMO</span>
  </h1>
  <p id="syncText">Shared golf group</p>
</header>
<main><div id="screen"></div></main>
<nav>
<button id="nround" onclick="show('round')">⛳<br>Round</button>
<button id="npay" onclick="show('pay')">💷<br>Pay</button>
<button id="nscores" onclick="show('scores')">🏌️<br>Scores</button>
<button id="nleague" onclick="show('league')">🏆<br>League</button>
<button id="nplayers" onclick="show('players')">👥<br>Players</button>
<button id="nsettings" class="hidden" onclick="leaveManageGroups()">⚙️<br>Settings</button>
</nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
let db=null, pin="", page="round", poller=null;
let leagueView="points";

function demoReadOnly(){
  return pin==="2026" && !isAdmin;
}
function demoCanEdit(){
  if(demoReadOnly()){
    alert("👀 Demo Mode\n\nThis demo is read-only.\nYou can explore the app without changing anything.");
    return false;
  }
  return true;
}
let lastWinnerRecord=null;
let statsPlayerId=null;
let myPlayerId=localStorage.getItem("tensInPlayerId")||"";
function chooseMyPlayer(){
  const existing=state.players.find(p=>p.id===myPlayerId);
  if(existing)return;

  document.querySelector("nav").style.display="none";

  $("screen").innerHTML=`
    <div class="card">
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:42px;">👋</div>
        <h2 style="margin:6px 0 8px;">Join your golf group</h2>
        <div class="muted">Tell us who you are to get started.</div>
      </div>
      ${state.players.length ? `
        <div class="notice" style="margin-bottom:12px;">
          <b>Already been added by the organiser?</b><br>Tap your name below.
        </div>
        ${[...state.players].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`
          <button class="secondary full" onclick="selectMyPlayer('${p.id}')">
            ${esc(p.name)}
          </button>
        `).join("")}
        <div class="notice" style="margin-top:18px;">
          <b>Can't see your name?</b><br>
          Add yourself with your name and handicap.
        </div>
      ` : `
        <div class="notice" style="margin-top:12px;">
          <b>You're the first player joining this group.</b><br>
          Add your name and handicap to get started.
        </div>
      `}
      <button class="primary full" onclick="addPlayer()">
        ➕ Add myself to the group
      </button>
    </div>
  `;
}
function installDeviceType(){
  const ua=navigator.userAgent||"";
  if(/iPhone|iPad|iPod/i.test(ua))return "iphone";
  if(/Android/i.test(ua))return "android";
  return "other";
}

function iosShareIcon(){
  return `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"
    style="vertical-align:middle">
    <path d="M12 16V3M12 3L8.5 6.5M12 3l3.5 3.5M6.5 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1.5"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function showInstallHelp(playerName){
  page="installhelp";
  clearInterval(poller);
  poller=null;

  const device=installDeviceType();

  let steps="";
  if(device==="iphone"){
    steps=`
      <div class="notice" style="text-align:left;margin-top:14px;">
        <b>iPhone — 3 simple steps</b><br><br>
        <b>1.</b> Make sure this page is open in <b>Safari</b>.<br><br>
        <b>2.</b> Tap the <b>•••</b> button at the bottom-right. Then tap <b>Share</b> ${iosShareIcon()}.<br><span class="muted">If you can already see Share, just tap it.</span><br><br>
        <b>3.</b> Scroll down and tap <b>Add to Home Screen</b>, then tap <b>Add</b>.
      </div>`;
  }else if(device==="android"){
    steps=`
      <div class="notice" style="text-align:left;margin-top:14px;">
        <b>Android — 3 simple steps</b><br><br>
        <b>1.</b> Make sure this page is open in <b>Chrome</b>.<br><br>
        <b>2.</b> Tap the <b>⋮ three-dot menu</b>.<br><br>
        <b>3.</b> Tap <b>Add to Home screen</b> (or <b>Install app</b>), then confirm.
      </div>`;
  }else{
    steps=`
      <div class="notice" style="text-align:left;margin-top:14px;">
        <b>Add I'm In Golf to your Home Screen</b><br><br>
        <b>iPhone:</b> Safari → <b>•••</b> → Share ${iosShareIcon()} → Add to Home Screen.<br>
        <span class="muted">If you can already see Share, just tap it.</span><br><br>
        <b>Android:</b> Chrome → ⋮ → Add to Home screen / Install app.
      </div>`;
  }

  $("screen").innerHTML=`
    <div class="card" style="text-align:center;">
      <div style="font-size:44px;">✅</div>
      <h2 style="font-size:24px;margin-top:8px;">You're in, ${esc(playerName)}!</h2>
      <div class="muted">Your phone will remember who you are.</div>

      <h2 style="margin-top:24px;">📱 Put I'm In Golf on your Home Screen</h2>
      <div class="muted">It only takes a few seconds.</div>

      ${steps}

      <button class="primary full" onclick="finishInstallHelp()">
        Continue to I'm In Golf
      </button>
      <button class="ghost full" onclick="finishInstallHelp()">
        I'll do this later
      </button>
    </div>`;
}

function finishInstallHelp(){
  page="round";
  if(db && !poller) startPolling();
  show("round");
}

function selectMyPlayer(id){
  const player=state.players.find(p=>p.id===id);
  if(!player)return;

  myPlayerId=player.id;
  localStorage.setItem("tensInPlayerId",myPlayerId);

  document.querySelector("nav").style.display="";
  showInstallHelp(player.name);
}
let state={
 course:"Hazel Grove Golf Club",
 date:"Saturday",
 stake:20,
 gameType:"money",
 pointsCompetition:"stableford",
 pointsValue:10,
 players:[
{id:"ga",name:"Greg A",handicap:11,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0},
{id:"gr",name:"Greg R",handicap:14,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0},
{id:"to",name:"Tony",handicap:16,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0},
{id:"bi",name:"Billy",handicap:18,paid:false,stableford:null,netScore:null,wins:0,leaguePoints:0,netWinnings:0}
   ],
 history:[]
};

const $=id=>document.getElementById(id);
function configured(){return window.TENS_IN_CONFIG && TENS_IN_CONFIG.supabaseUrl && !TENS_IN_CONFIG.supabaseUrl.includes("PASTE_")}
window.addEventListener("load",()=>{
  if(!configured()) $("configMissing").classList.remove("hidden");

  const urlPin=new URLSearchParams(window.location.search).get("pin");
  const saved=localStorage.getItem("tensInPin");

  if(urlPin){
    $("pinInput").value=urlPin;
    connect();
  }else if(saved){
    $("pinInput").value=saved;
  }
});

async function connect(){
 if(!configured()){ $("connectMsg").textContent="Please complete the one-time database setup first."; return; }
 pin=$("pinInput").value.trim(); if(!pin){$("connectMsg").textContent="Enter your group PIN.";return}
 $("connectMsg").textContent="Opening shared group…";
 db=supabase.createClient(TENS_IN_CONFIG.supabaseUrl,TENS_IN_CONFIG.supabaseKey);

 const {data:accessRows,error:accessError}=await db.rpc(
   "get_group_access_status",
   {p_pin:pin}
 );
 if(accessError){
   $("connectMsg").textContent="Couldn't check group access. Please try again.";
   return;
 }

 const access=Array.isArray(accessRows) ? accessRows[0] : accessRows;

 if(!access){
   $("connectMsg").textContent="PIN not recognised.";
   return;
 }

 if(access.access_allowed===false){
   clearInterval(poller);
   poller=null;

   $("setupOverlay").classList.add("hidden");
   document.querySelector("nav").style.display="none";
   $("syncText").textContent="Group access unavailable";

   if(access.access_reason==="trial_expired"){
     $("screen").innerHTML=`
       <div class="card" style="text-align:center;margin-top:18px;">
         <div style="font-size:42px;margin-bottom:8px;">⏳</div>
         <h2>Your free trial has ended</h2>
         <p class="muted">${esc(access.group_name||"This group")}'s free trial has finished.</p>
         <div class="notice">
           <b>Continue with I'm In Golf for £19.99 per year.</b><br>
           Annual subscription payment will be available here soon.
         </div>
         <button class="secondary full" onclick="location.reload()">
           ← Use a different Group PIN
         </button>
       </div>`;
   }else{
     $("screen").innerHTML=`
       <div class="card" style="text-align:center;margin-top:18px;">
         <div style="font-size:42px;margin-bottom:8px;">🔒</div>
         <h2>Group access suspended</h2>
         <p class="muted">${esc(access.group_name||"This group")} is currently suspended.</p>
         <div class="notice warning">
           Please contact the I'm In Golf administrator if you believe this is a mistake.
         </div>
         <button class="secondary full" onclick="location.reload()">
           ← Use a different Group PIN
         </button>
       </div>`;
   }
   return;
 }

 const {data,error}=await db.rpc("get_group_state",{p_pin:pin});
 if(error || !data){$("connectMsg").textContent="PIN not recognised, or database setup is incomplete.";return}
state=data;
localStorage.setItem("tensInPin",pin);
$("demoBadge").classList.toggle("hidden", pin!=="2026");
$("setupOverlay").classList.add("hidden");
$("syncText").textContent="Shared • everyone sees the same game";

const setupTokenFromUrl=
  new URLSearchParams(window.location.search).get("adminsetup");

if(!state.adminPin && setupTokenFromUrl){
  if(String(state.adminSetupToken||"")===String(setupTokenFromUrl)){
    const first=prompt("Welcome, Group Admin!\\n\\nChoose your own 4-digit Admin PIN.");
    if(first!==null){
      const clean=String(first).trim();
      if(!validAdminPin(clean)){
        alert("Please choose exactly 4 numbers. Reopen the private setup link and try again.");
      }else{
        const second=prompt("Enter your new 4-digit Admin PIN again");
        if(second!==null && String(second).trim()===clean){
          state.adminPin=clean;
          state.adminSetupToken="";
          const saved=await save();
          if(saved){
            isAdmin=true;
            sessionStorage.setItem("tensInAdmin","yes");
            history.replaceState({},document.title,location.pathname+"?pin="+encodeURIComponent(pin));
            alert("✅ Admin PIN created. You are now the Admin for this golf group.");
          }else{
            state.adminPin="";
            alert("Admin PIN could not be saved. Reopen the setup link and try again.");
          }
        }else if(second!==null){
          alert("The two PINs did not match. Reopen the private setup link and try again.");
        }
      }
    }
  }else{
    alert("This Admin setup link is no longer valid.");
  }
}

const existing=state.players.find(p=>p.id===myPlayerId);

if(existing){
  show("round");
}else{
  page="players";
  chooseMyPlayer();
}

startPolling();
 }
async function save(){

  if(!db)return;

  if(demoReadOnly()){
    $("syncText").textContent="Demo • read only";
    return false;
  }

  $("syncText").textContent="Saving…";

  const {data,error}=await db.rpc(
    "save_group_state",
    {p_pin:pin,p_state:state}
  );

  $("syncText").textContent=
    error ? "Couldn't sync" : "Shared • synced";

  return !error;
}
async function refresh(){
 if(!db)return;

 // Keep Owner utility screens on display.
 // Do not let the 5-second background sync redraw them while they are open.
 if(page==="admininvite" || page==="managegroups" || page==="editgroup")return;

 const editing=document.activeElement &&
   document.activeElement.tagName==="INPUT";

 if(editing)return;

 const {data,error}=await db.rpc("get_group_state",{p_pin:pin});
if(!error && data){
  state=data;

  // Only redraw the app if this phone's saved player still exists
  // in the current group. This prevents "Find my name" from being
  // replaced by the join screen every 5 seconds when a stale player
  // ID is stored from another group.
  const currentPlayerExists=
    myPlayerId && state.players.some(p=>p.id===myPlayerId);

  if(currentPlayerExists){
    render();
  }

  $("syncText").textContent=
  demoReadOnly() ? "Demo • read only" : "Shared • synced";
}

 }
function startPolling(){ clearInterval(poller); poller=setInterval(refresh,5000); }
function show(p){page=p;document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));$("n"+p).classList.add("active");render();}
function render(){
  updateAdminUI();

  if(page==="round")round();
  if(page==="pay")pay();
  if(page==="scores")scores();
  if(page==="league")league();
  if(page==="playerstats" && statsPlayerId)showPlayerStats(statsPlayerId);
  if(page==="players")playersPage();
  if(page==="settings")settingsPage();
  if(page==="admininvite")adminInvitePage();
  if(page==="managegroups")manageGroupsPage();
  if(page==="editgroup")editGroupPage();
}
function roundLocked(){
  return state.players.some(p=>p.stableford!=null || p.netScore!=null);
}
function paidCount(){return state.players.filter(p=>p.paid).length}
function potentialPot(){return Number(state.stake||0)*state.players.length}
function pot(){return Number(state.stake||0)*paidCount()}
function stablefordPaidCount(){
  return state.players.filter(p=>p.paid && p.competition==="stableford").length;
}

function netPaidCount(){
  return state.players.filter(p=>p.paid && p.competition==="net").length;
}

function stablefordPot(){
  return Number(state.stake||0)*stablefordPaidCount();
}

function netPot(){
  return Number(state.stake||0)*netPaidCount();
}
function round(){

  const pointsFirst=Number(state.pointsValue||10);
  const pointsSecond=Math.round(pointsFirst*0.6);
  const pointsThird=Math.round(pointsFirst*0.3);
$("screen").innerHTML=`

  ${state.trip?.active ? `
    <div class="card" style="text-align:center;">
      <div style="font-size:28px;">✈️</div>
      <div class="muted">TRIP MODE</div>

      <h2 style="margin:4px 0;">
        ${esc(state.trip.name)}
      </h2>

      <div style="font-weight:800;">
        Round ${state.trip.currentRound} of ${state.trip.totalRounds}
      </div>
    </div>
  ` : ""}

  <div class="card">

      <div class="row">
      <div>
        <div class="muted">CURRENT ROUND</div>
        <h2>${esc(state.course)}</h2>
        <div class="muted">${esc(formatDate(state.date))} • ${state.players.length} players</div>

        <div style="margin-top:8px;">
          <span class="pill paid">
            ${state.gameType==="points" ? "🏆 POINTS GAME" : "💷 MONEY GAME"}
          </span>
        </div>
      </div>

      <span class="pill ${roundLocked()?'pending':'paid'}">
        ${roundLocked()?'🔒 ENTRIES CLOSED':'OPEN'}
      </span>
    </div>
  </div>

  <div class="card">
    <h2>Round details</h2>

    ${isAdmin ? `
      <label class="muted">Course</label>
      <input value="${escAttr(state.course)}" onchange="state.course=this.value;save()">

      <div>
        <label class="muted">Date</label>
        <input type="date" value="${escAttr(state.date)}" onchange="state.date=this.value;save();render()">

        ${state.gameType==="money" ? `
          <label class="muted">Stake per player (£)</label>
          <input type="number" min="0" step="1" value="${state.stake}" onchange="state.stake=+this.value;save();render()">
        ` : `
          <div class="notice">
            <b>${state.pointsCompetition==="stableford" ? "🏆 Stableford" : "⛳ Net"}</b><br>
            Points Game • Top 3 score league points
          </div>
        `}
      </div>
    ` : `
      <div class="muted">Course</div>
      <b>${esc(state.course)}</b>

      <div style="height:10px"></div>

      ${state.gameType==="money" ? `
        <div class="grid2">
          <div>
            <div class="muted">Date</div>
            <b>${esc(formatDate(state.date))}</b>
          </div>
          <div>
            <div class="muted">Stake per player</div>
            <b>£${state.stake}</b>
          </div>
        </div>
      ` : `
        <div class="grid2">
          <div>
            <div class="muted">Date</div>
            <b>${esc(formatDate(state.date))}</b>
          </div>
          <div>
            <div class="muted">Competition</div>
            <b>${state.pointsCompetition==="stableford" ? "Stableford" : "Net"}</b>
          </div>
        </div>
      `}
    `}
  </div>

  ${state.gameType==="money" ? `
    <div class="card">
      <h2>💷 Pay Before Play</h2>

      <div class="row">
        <div>
          <div class="big">£${pot()}</div>
          <div class="muted">Paid pot • £${potentialPot()} if everyone pays</div>
          <div class="muted" style="margin-top:6px;">
            🏆 Stableford pot: £${stablefordPot()} • ⛳ Net pot: £${netPot()}
          </div>
        </div>

        <span class="pill ${paidCount()===state.players.length?'paid':'pending'}">
          ${paidCount()}/${state.players.length} PAID
        </span>
      </div>

      <div class="notice">
        ${paidCount()===state.players.length
          ? "🔒 Everyone is paid — ready to play."
          : "Payments must be marked before tee-off."}
      </div>

      <button class="primary full" onclick="show('pay')">Manage payments</button>
    </div>
  ` : `
    <div class="card">
      <h2>🏆 Points Game</h2>

      <div class="notice">
        <b>${state.pointsCompetition==="stableford" ? "🏆 Stableford" : "⛳ Net"}</b><br>
        Everyone plays the same competition.
      </div>

      <div class="player row">
        <div>
          <b>🥇 1st place</b>
        </div>
        <span class="money">${pointsFirst} pts</span>
      </div>

      <div class="player row">
        <div>
          <b>🥈 2nd place</b>
        </div>
        <span class="money">${pointsSecond} pts</span>
      </div>

      <div class="player row">
        <div>
          <b>🥉 3rd place</b>
        </div>
        <span class="money">${pointsThird} pts</span>
      </div>

      <div class="muted" style="margin-top:10px;">
        Top 3 players score league points.
      </div>
    </div>
  `}

  <div class="card">
    <button class="secondary full" onclick="shareApp()">📤 Share I'm In Golf</button>
    <button class="ghost full" onclick="adminLogin()">🔐 Admin</button>
  </div>`;
}
function shareApp(){
  const url="https://imingolf.co.uk/app/?pin="+encodeURIComponent(pin);

  const message=`⛳ You're invited to I'm In Golf

Tap the link below to join our golf group:
${url}

async function finishRound(){

  const isPointsGame=state.gameType==="points";
  const pointsComp=state.pointsCompetition || "stableford";
  const isTrip=Boolean(state.trip?.active);

  function chooseCountbackWinner(players,competition,score,position){
    const names=players.map((p,i)=>`${i+1}. ${p.name}`).join("\n");

    const answer=prompt(
      `${competition} tie for ${position} on ${score}.\n\n` +
      `Check the scorecards and choose the player on countback:\n\n` +
      names +
      `\n\nEnter the player's number.`
    );

    if(answer===null)return null;

    const selected=Number(answer)-1;

    if(selected<0 || selected>=players.length){
      alert("Please choose one of the listed players.");
      return chooseCountbackWinner(
        players,
        competition,
        score,
        position
      );
    }

    return players[selected];
  }


  // =====================================
  // 🏆 POINTS GAME
  // =====================================

  if(isPointsGame){

    const scoredPlayers=state.players.filter(p=>
      pointsComp==="stableford"
        ? p.stableford!=null
        : p.netScore!=null
    );

    if(!scoredPlayers.length){
      alert(
        pointsComp==="stableford"
          ? "Enter at least one Stableford score first."
          : "Enter at least one Net score first."
      );
      return;
    }

    let remaining=[...scoredPlayers];

    const places=[];
    const placeNames=["1st","2nd","3rd"];

    for(let place=0; place<3 && remaining.length; place++){

      const bestScore=
        pointsComp==="stableford"
          ? Math.max(...remaining.map(p=>Number(p.stableford)))
          : Math.min(...remaining.map(p=>Number(p.netScore)));

      const tied=remaining.filter(p=>
        pointsComp==="stableford"
          ? Number(p.stableford)===bestScore
          : Number(p.netScore)===bestScore
      );

      let selectedPlayer=tied[0];
      let countback=false;

      if(tied.length>1){

        selectedPlayer=chooseCountbackWinner(
          tied,
          pointsComp==="stableford" ? "Stableford" : "Net",
          pointsComp==="stableford"
            ? bestScore + " points"
            : bestScore,
          placeNames[place]
        );

        if(!selectedPlayer)return;

        countback=true;
      }

      places.push({
        name:selectedPlayer.name,
        score:
          pointsComp==="stableford"
            ? Number(selectedPlayer.stableford)
            : Number(selectedPlayer.netScore),
        position:place+1,
        countback:countback
      });

      remaining=remaining.filter(p=>p!==selectedPlayer);
    }

    const firstPoints=Number(state.pointsValue||10);
    const secondPoints=Math.round(firstPoints*0.6);
    const thirdPoints=Math.round(firstPoints*0.3);

    const pointsAwards=[
      firstPoints,
      secondPoints,
      thirdPoints
    ];
places.forEach((place,i)=>{
  place.points=pointsAwards[i];

  if(isTrip){

    state.trip.standings=state.trip.standings || {};

    state.trip.standings[place.name]=
      Number(state.trip.standings[place.name]||0)+place.points;

  }else{

    const player=state.players.find(p=>p.name===place.name);

    if(player){
      player.leaguePoints=
        Number(player.leaguePoints||0)+place.points;
    }
  }
});
        const record={
      date:state.date,
      course:state.course,

      gameType:"points",
      pointsCompetition:pointsComp,
      pointsValue:firstPoints,
      pointsResults:places,

      winners:places.length ? [places[0].name] : [],

      stablefordWinnerNames:
        pointsComp==="stableford" && places.length
          ? [places[0].name]
          : [],

      netWinnerNames:
        pointsComp==="net" && places.length
          ? [places[0].name]
          : [],

      stablefordCountback:
        pointsComp==="stableford"
          ? Boolean(places[0]?.countback)
          : false,

      netCountback:
        pointsComp==="net"
          ? Boolean(places[0]?.countback)
          : false,

      players:state.players.map(p=>({
        name:p.name,
        handicap:p.handicap,
        competition:pointsComp,
        stableford:p.stableford,
        netScore:p.netScore
      }))
    };
if(isTrip){
  state.trip.rounds=state.trip.rounds || [];
  state.trip.rounds.push(record);
}else{
  state.history=state.history || [];
  state.history.unshift(record);
}
    
// Normal Points Game winner counts as a weekly win
// Trip Points Game winner stays inside Trip Mode only
if(!isTrip && places[0]){
  const winner=state.players.find(
    p=>p.name===places[0].name
  );

  if(winner){
    winner.wins=(winner.wins||0)+1;
  }
}

    state.players.forEach(p=>{
  p.paid=false;
  p.stableford=null;
  p.netScore=null;
  p.competition=null;
});

if(isTrip){
  if(state.trip.currentRound < state.trip.totalRounds){
    state.trip.currentRound += 1;
  }else{
    state.trip.completed=true;
    state.trip.active=false;
  }
}
        await save();
    showWinnerScreen(record);
    return;
  }


  // =====================================
  // 💷 MONEY GAME
  // =====================================

  const stablefordPlayers=state.players.filter(
    p=>p.paid &&
       p.competition==="stableford" &&
       p.stableford!=null
  );

  const netPlayers=state.players.filter(
    p=>p.paid &&
       p.competition==="net" &&
       p.netScore!=null
  );

  if(!stablefordPlayers.length && !netPlayers.length){
    alert("Enter at least one Stableford or Net score first.");
    return;
  }

  const stablefordBest=stablefordPlayers.length
    ? Math.max(
        ...stablefordPlayers.map(
          p=>Number(p.stableford)
        )
      )
    : null;

  const netBest=netPlayers.length
    ? Math.min(
        ...netPlayers.map(
          p=>Number(p.netScore)
        )
      )
    : null;

  let stablefordWinners=
    stablefordBest===null
      ? []
      : stablefordPlayers.filter(
          p=>Number(p.stableford)===stablefordBest
        );

  let netWinners=
    netBest===null
      ? []
      : netPlayers.filter(
          p=>Number(p.netScore)===netBest
        );

  let stablefordCountback=false;
  let netCountback=false;


  if(stablefordWinners.length>1){

    const winner=chooseCountbackWinner(
      stablefordWinners,
      "Stableford",
      stablefordBest + " points",
      "1st"
    );

    if(!winner)return;

    stablefordWinners=[winner];
    stablefordCountback=true;
  }


  if(netWinners.length>1){

    const winner=chooseCountbackWinner(
      netWinners,
      "Net",
      netBest,
      "1st"
    );

    if(!winner)return;

    netWinners=[winner];
    netCountback=true;
  }

const winners=[
  ...stablefordWinners.map(p=>p.name),
  ...netWinners.map(p=>p.name)
];


// =====================================
// ✈️ TRIP MONEY GAME POINTS

  let remainingTrip=[...tripPlayers];
tripPlaces=[];

const tripPlaceNames=["1st","2nd","3rd"];

for(let place=0; place<3 && remainingTrip.length; place++){

  const bestScore=
    tripComp==="stableford"
      ? Math.max(...remainingTrip.map(p=>Number(p.stableford)))
      : Math.min(...remainingTrip.map(p=>Number(p.netScore)));

  const tied=remainingTrip.filter(p=>
    tripComp==="stableford"
      ? Number(p.stableford)===bestScore
      : Number(p.netScore)===bestScore
  );

  let selectedPlayer=tied[0];

  if(tied.length>1){

    selectedPlayer=chooseCountbackWinner(
      tied,
      tripComp==="stableford" ? "Stableford" : "Net",
      tripComp==="stableford"
        ? bestScore + " points"
        : bestScore,
      tripPlaceNames[place]
    );

    if(!selectedPlayer)return;
  }

  tripPlaces.push(selectedPlayer);

  remainingTrip=
    remainingTrip.filter(p=>p!==selectedPlayer);
}

  const tripFirst=Number(state.trip.tripPointsValue||10);

  const tripAwards=[
  tripFirst,
  Math.round(tripFirst*0.6),
  Math.round(tripFirst*0.3)
];
  state.trip.standings=state.trip.standings || {};

  tripPlaces.forEach((p,i)=>{
    const points=tripAwards[i];

    state.trip.standings[p.name]=

  });
}


const record={
      date:state.date,
    course:state.course,

async function deleteOwnerGroup(groupPin){

  if(!db || !isAdmin || !isOwner || !ownerCreationCode){
    alert("I'm In Golf Owner access required.");
    return;
  }

  const cleanPin=String(groupPin||"");

  if(cleanPin==="1010"){
    alert("🔐 The Owner group cannot be deleted.");
    return;
  }

  const g=ownerGroups.find(
    x=>String(x.group_pin)===cleanPin
  );

  if(!g){
    alert("Group could not be found.");
    return;
  }

  const groupName=String(g.group_name||"Unnamed Group");

  const firstConfirm=confirm(
    "🗑️ Delete " + groupName + "?\n\n" +
    "Group PIN: " + cleanPin + "\n\n" +
    "This permanently removes this group and its saved group data.\n\n" +
    "This cannot be undone."
  );

  if(!firstConfirm)return;

  const typed=prompt(
    "Final confirmation\n\n" +
    "Type the Group PIN " + cleanPin + " to permanently delete " + groupName + "."
  );

  if(typed===null)return;

  if(String(typed).trim()!==cleanPin){
    alert("Group PIN did not match. Nothing was deleted.");
    return;
  }

  const {error}=await db.rpc(
    "owner_delete_group",
    {
      p_creation_code:ownerCreationCode,
      p_group_pin:cleanPin
    }
  );

  if(error){
    alert(
      "Group could not be deleted.\n\n" +
      (error.message||"Please try again.")
    );
    return;
  }

  alert("✅ " + groupName + " deleted.");
  await manageGroupsPage();
}

async function ownerResetAdminPin(){
  if(!db || !isAdmin || !isOwner || !ownerCreationCode){
    alert("I'm In Golf Owner access required.");
    return;
  }

  const groupPin=String(ownerEditGroupPin||"");
  if(!groupPin){
    alert("Group could not be identified.");
    return;
  }

  const first=prompt("Choose a new 4-digit Admin PIN for group " + groupPin);
  if(first===null)return;

  const clean=String(first).trim();
  if(!validAdminPin(clean)){
    alert("Please choose exactly 4 numbers.");
    return;
  }

  const second=prompt("Enter the new 4-digit Admin PIN again");
  if(second===null)return;

  if(String(second).trim()!==clean){
    alert("The two PINs did not match.");
    return;
  }

  const ok=confirm("Reset the Admin PIN for group " + groupPin + "?");
  if(!ok)return;

  const {data,error}=await db.rpc(
    "owner_reset_admin_pin",
    {
      p_creation_code:ownerCreationCode,
      p_group_pin:groupPin,
      p_new_admin_pin:clean
    }
  );

  if(error || data!==true){
    alert(
      "Admin PIN could not be reset.\n\n" +
      (error?.message || "Please try again.")
    );
    return;
  }

  if(groupPin===String(pin)){
    state.adminPin=clean;
    state.adminSetupToken="";
  }

  alert("✅ Admin PIN reset for group " + groupPin + ".");
}

async function saveOwnerGroupEdit(){
  if(!db || !isOwner || !ownerCreationCode)return;

  const g=ownerGroups.find(x=>String(x.group_pin)===String(ownerEditGroupPin));
  if(!g)return;

  const protectedGroup=String(g.group_pin)==="1010";

  const args={
    p_creation_code:ownerCreationCode,
    p_group_pin:String(g.group_pin),
    p_admin_name:$("ownerAdminName").value.trim(),
    p_admin_contact:$("ownerAdminContact").value.trim(),
    p_plan_type:protectedGroup ? "internal" : $("ownerPlanType").value,
    p_trial_expiry_date:$("ownerTrialExpiry").value || null,
    p_paid_status:$("ownerPaidStatus").value,
    p_renewal_date:$("ownerRenewalDate").value || null,
    p_status:protectedGroup ? "active" : $("ownerGroupStatus").value,
    p_notes:$("ownerNotes").value.trim()
  };

  const saveButton=document.querySelector('#screen button.primary');
  if(saveButton){
    saveButton.disabled=true;
    saveButton.textContent="Saving…";
  }

  const {error}=await db.rpc("owner_update_group",args);

  if(error){
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent="💾 Save Changes";
    }
    alert("Group changes could not be saved.\n\n" + (error.message||"Please try again."));
    return;
  }

  alert("✅ Group details updated.");
  ownerEditGroupPin="";
  await manageGroupsPage();
}

function formatOwnerDate(value){
  if(!value)return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function pickTripDate(title,initialValue=""){
  return new Promise(resolve=>{

    const overlay=document.createElement("div");

    overlay.style.cssText=
      "position:fixed;inset:0;background:rgba(0,0,0,.35);" +
      "z-index:9999;display:flex;align-items:center;" +
      "justify-content:center;padding:20px;";

    overlay.innerHTML=`
      <div style="
        background:white;
        width:min(420px,100%);
        padding:20px;
        border-radius:18px;
      ">
        <h2>${esc(title)}</h2>

        <input
          id="tripDatePicker"
          type="date"
          value="${escAttr(initialValue)}"
          style="font-size:18px;"
        >

        <div class="grid2">
          <button class="secondary" id="tripDateCancel">
            Cancel
          </button>

          <button class="primary" id="tripDateOK">
            OK
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    const input=overlay.querySelector("#tripDatePicker");

    overlay.querySelector("#tripDateCancel").onclick=()=>{
      overlay.remove();
      resolve(null);
    };

    overlay.querySelector("#tripDateOK").onclick=()=>{
      const value=input.value;

      if(!value){
        alert("Please choose a date.");
        return;
      }

      overlay.remove();
      resolve(value);
    };
  });
}

    "\n\nEnter the trip number."
  );

  if(answer===null)return;

  const index=Number(answer)-1;

  if(index<0 || index>=pastTrips.length){
    alert("Please enter a valid trip number.");
    return;
  }

  const tripName=pastTrips[index].name || "Trip";

  if(!confirm(
    "Delete " + tripName + "?\n\n" +
    "This removes only this past Trip.\n\n" +
    "Normal leagues, players and current round will not be changed."
  ))return;

  pastTrips.splice(index,1);

  state.trip.pastTrips=pastTrips;

  await save();
  render();

  alert(tripName + " deleted.");
}
async function finishTrip(){

  if(!state.trip?.completed){
    alert("The Trip is not complete yet.");
    return;
  }

  const tripName=state.trip.name || "Trip";

  if(!confirm(
    "🏁 Finish " + tripName + "?\n\n" +
    "The completed Trip and final standings will be saved.\n\n" +
    "Your normal round will then be restored."
  ))return;

  // Find the normal round backup
  const backup=
    state.trip?.normalRoundBackup ||
    state.trip?.pastTrips?.[0]?.normalRoundBackup;

  if(!backup){
    alert(
      "Normal round backup could not be found.\n\n" +
      "The Trip has not been closed."
    );
    return;
  }

  // Keep existing archived trips separate
  const existingPastTrips=[
    ...(state.trip?.pastTrips || [])
  ];

  // Create a clean completed Trip copy.
  // IMPORTANT: do not copy pastTrips into itself.
  const completedTrip={
    name:state.trip.name,
    totalRounds:state.trip.totalRounds,
    currentRound:state.trip.currentRound,
    competition:state.trip.competition,
    tripPointsValue:state.trip.tripPointsValue,
    rounds:[...(state.trip.rounds || [])],
    standings:{...(state.trip.standings || {})},
    champion:state.trip.champion || null,
    completed:true,
    active:false,
    normalRoundBackup:state.trip.normalRoundBackup || backup
  };

  const pastTrips=[
    completedTrip,
    ...existingPastTrips
  ];

  // Restore the normal weekly round
  state.course=backup.course;
  state.date=backup.date;
  state.stake=backup.stake;
  state.gameType=backup.gameType;
  state.pointsCompetition=backup.pointsCompetition;
  state.pointsValue=backup.pointsValue;

  state.players=backup.players.map(p=>({
    id:p.id,
    name:p.name,
    handicap:p.handicap,
    paid:p.paid,
    competition:p.competition,
    stableford:p.stableford,
    netScore:p.netScore,
    wins:p.wins,
    leaguePoints:p.leaguePoints,
    netWinnings:p.netWinnings
  }));

  // Trip Mode is now closed,
  // but completed Trips remain archived.
  state.trip={
    active:false,
    name:"",
    totalRounds:0,
    currentRound:0,
    competition:null,
    tripPointsValue:10,
    rounds:[],
    standings:{},
    champion:null,
    completed:false,
    pastTrips:pastTrips
  };

  await save();
  show("round");

  alert(
    "🏁 " + tripName + " saved.\n\n" +
    "Your normal round has been restored."
  );
}
async function cancelTrip(){

  if(!state.trip?.active){

  }

state.trip={

async function deleteLastRound(){
  if(!state.history || !state.history.length){
    alert("There are no completed rounds to delete.");
    return;
  }

  const lastRound=state.history[0];

  const winnerNames=(lastRound.winners||[]).join(", ") || "No winner recorded";

  let extraText="";

  if(lastRound.gameType==="points" && lastRound.pointsResults?.length){
    extraText=
      "\n\nPoints to be removed:\n" +
      lastRound.pointsResults.map(r=>
        r.name + " -" + r.points + " pts"
      ).join("\n");
  }

  const deleteMessage=
    "Delete this completed round?\n\n" +
    lastRound.course + " • " + formatDate(lastRound.date) + "\n" +
    "Winner: " + winnerNames +
    extraText +
    "\n\nThis will remove the round and correct the league stats.\n\n" +
    "Are you sure?";

  if(!confirm(deleteMessage))return;

  // Undo winner win
  (lastRound.winners||[]).forEach(name=>{
    const p=state.players.find(x=>x.name===name);

    if(p && (p.wins||0)>0){
      p.wins=p.wins-1;
    }
  });

  // Undo Points Game league points
  if(lastRound.gameType==="points" && lastRound.pointsResults?.length){

    lastRound.pointsResults.forEach(result=>{
      const p=state.players.find(x=>x.name===result.name);

      if(p){
        p.leaguePoints=Math.max(
          0,
          Number(p.leaguePoints||0)-Number(result.points||0)
        );
      }
    });
  }

  state.history.shift();

  render();
  await save();

  alert("Last round deleted and league stats corrected.");
}
async function clearLeague(){
 if(!confirm("Clear the entire league table and previous round history?"))return;

 state.players.forEach(p=>{
   p.wins=0;
   p.leaguePoints=0;

 });

 state.history=[];

 render();
 await save();

 alert("League and previous round history cleared.");
}

function formatDate(d){
 if(!d || !d.includes("-"))return d;
 const [y,m,day]=d.split("-");
 return `${Number(day)}.${Number(m)}.${y.slice(2)}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s)}
