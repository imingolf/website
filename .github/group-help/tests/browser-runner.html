<!doctype html><html lang="en"><meta charset="utf-8"><title>Group Help and member checks</title><style>body{font:15px system-ui;margin:20px;background:#f5f8f5}iframe{height:844px;border:1px solid #ccc}pre{white-space:pre-wrap}button{padding:10px;margin:5px}</style><h1>Group Help and member checks</h1><p id="status">Running isolated checks…</p><button id="organiser">Review organiser</button><button id="player">Review player</button><pre id="results"></pre><iframe id="app" title="Actual app with synthetic data" width="390"></iframe><script>
const frame=document.querySelector('#app'),out=document.querySelector('#results'),results=[];
const check=(name,ok)=>{if(!ok)throw Error(name);results.push(name);out.textContent=JSON.stringify({passed:results.length,results},null,2)};
const pause=(ms=100)=>new Promise(r=>setTimeout(r,ms));
const wait=async test=>{const start=Date.now();while(!test()){if(Date.now()-start>9000)throw Error('Timeout: '+String(test));await pause(30)}};
const win=()=>frame.contentWindow,doc=()=>frame.contentDocument,get=id=>doc().getElementById(id),visible=el=>!!el&&el.getClientRects().length>0;
const button=text=>[...doc().querySelectorAll('button')].find(b=>b.textContent.trim()===text&&visible(b));
async function click(el){if(!el)throw Error('Missing button');el.click();await pause()}
const label=()=>doc().querySelector('.ui-app-name').textContent;
const readsOnly=()=>win().IIGPreview.calls.every(c=>/^\/rest\/v1\/rpc\/(iig_(read_entry_group|read_owned_entry_group|list_owned_groups|get_player_join_options)|get_group_access_status)$/.test(c.path));
async function load(cfg){localStorage.clear();sessionStorage.clear();localStorage.setItem('iig-group-help-case',JSON.stringify(cfg));frame.src='/app/?qa='+Date.now()+(cfg.role==='player'?'#pin=4827':'');await new Promise(r=>frame.onload=r);await wait(()=>get('regCreate')&&!get('regCreate').disabled);if(cfg.role!=='player'){await wait(()=>visible(get('regOpenGroup')));await click(get('regOpenGroup'))}await wait(()=>win().iigSecurePlayer.active||win().iigSecureOrganiser.active);await pause()}
async function group(){if(visible(get('simplerGroupInfo')))return;await click(get('uiPlayerOptions')||get('simplerOrganiserMenu'));await wait(()=>visible(get('simplerGroupInfo')))}
async function help(role){await group();check(role+' Group Help is visible in Group',visible(get('iigGroupHelp')));check(role+' Help belongs to account/group options',!!get('iigGroupHelp').parentElement.querySelector(role==='player'?'#securePlayerAccount':'#secureOrganiserAccount'));await click(get('iigGroupHelp').querySelector('button'));check(role+' Help opens',visible(get('iigGroupHelp').querySelector('textarea')));check(role+' request choices remain simple',get('iigGroupHelp').querySelector('select').options.length===3);await click(button('Open email to send'));check(role+' blank requests are blocked',win().IIGPreview.alerts.at(-1)==='Please enter your email and a message.');for(const width of [320,390,768]){frame.width=width;await pause();check(role+' Group Help fits '+width+'px',doc().documentElement.scrollWidth<=width)}frame.width=390;await click(get('iigGroupHelp').querySelector('button'));check(role+' Help closes',!visible(get('iigGroupHelp').querySelector('textarea')))}
(async()=>{
 await load({role:'organiser'});const ownerData=JSON.stringify(win().IIGPreview.data);check('Organiser header counts whole roster',label()==='QA Golf · 3 members');await help('organiser');
 check('Existing organiser Group controls remain available',['secureOrganiserInvite','secureOrganiserReload','secureOrganiserAccount','secureOrganiserSignout','simplerChangeGroup','simplerGroupSettings'].every(id=>visible(get(id))));
 await click(button('Back'));check('Back returns to current round',!get('screen').hidden&&!get('simplerGroupInfo'));
 for(const id of ['nplayers','nround','npay','nscores','nleague']){await click(get(id));check('Organiser navigation '+id+' remains responsive',visible(get('screen'))&&label()==='QA Golf · 3 members')}
 await click(get('nround'));get('simplerAdminControls').open=true;await click(get('simplerRoleSwitch'));await wait(()=>win().iigSecurePlayer.active&&get('simplerRoleSwitch')?.textContent==='Organiser view'&&!get('simplerOrganiserMenu'));check('Organiser switches to player with same total',label()==='QA Golf · 3 members');
 get('simplerAdminControls').open=true;await click(get('simplerRoleSwitch'));await wait(()=>win().iigSecureOrganiser.active&&get('simplerRoleSwitch')?.textContent==='Player view'&&!get('uiPlayerOptions'));check('Player switches back to organiser with same total',label()==='QA Golf · 3 members');
 await group();await click(get('simplerChangeGroup'));await wait(()=>doc().querySelector('button[data-group-pin="6938"]'));await click(doc().querySelector('button[data-group-pin="6938"]'));await wait(()=>label()==='QA Golf Extended · 1 member');check('Changing groups uses new roster and singular count',label()==='QA Golf Extended · 1 member');check('Organiser checks perform reads only',readsOnly()&&JSON.stringify(win().IIGPreview.data)===ownerData);
 await load({role:'player'});const playerData=JSON.stringify(win().IIGPreview.data);check('Player header counts all group members',label()==='QA Golf · 3 members');await help('player');
 check('Help survives a hidden entry section with no open round',get('securePlayerWithdraw').closest('details').hidden&&visible(get('iigGroupHelp')));
 check('Existing player Group controls remain available',['securePlayerReload','securePlayerAccount','securePlayerSignout','simplerChangeGroup'].every(id=>visible(get(id))));
 await click(button('Back'));for(const id of ['nplayers','nround','npay','nscores','nleague']){await click(get(id));check('Player navigation '+id+' remains responsive',visible(get('screen'))&&label()==='QA Golf · 3 members')}
 check('Ordinary player has no organiser controls',!visible(get('simplerAdminControls')));check('Player checks preserve every record and only read data',readsOnly()&&JSON.stringify(win().IIGPreview.data)===playerData);
 await click(get('nround'));await group();let mutations=0;const observer=new (win().MutationObserver)(r=>mutations+=r.length);observer.observe(doc().querySelector('main'),{childList:true,subtree:true,characterData:true});await pause(250);mutations=0;for(let i=0;i<100;i++)win().iigDecorateLive();await pause(400);observer.disconnect();check('Actual app settles without repeated decoration mutations',mutations===0);check('No duplicated Group Help after navigation',doc().querySelectorAll('#iigGroupHelp').length===1);
 win().IIGPreview.setCount(2);await click(get('securePlayerReload'));await wait(()=>label()==='QA Golf · 2 members');check('Reload refreshes membership count',label()==='QA Golf · 2 members');
 await group();await click(get('securePlayerSignout'));await wait(()=>!win().iigSecurePlayer.active);check('Sign-out clears Help and previous group total',!get('iigGroupHelp')&&label()==='I’m In Golf');
 await load({role:'player',open:true,closed:true});await help('player');check('Help remains visible after scoring when entry controls disappear',visible(get('iigGroupHelp')));check('Closed entry fixture has no writes',readsOnly());
 await load({role:'organiser',count:0});check('Empty confirmed organiser group displays zero',label()==='QA Golf · 0 members');await group();check('Empty group retains Group Help',visible(get('iigGroupHelp')));
 document.querySelector('#status').textContent='PASS — '+results.length+' isolated actual-app checks';out.textContent=JSON.stringify({passed:results.length,results,scope:'Actual app files. Synthetic Auth/API. Network-blocking CSP. No LIVE data or emails.'},null,2);
})().catch(e=>{document.querySelector('#status').textContent='FAIL — '+e.message;out.textContent+='\n'+e.stack});
document.querySelector('#organiser').onclick=async()=>{await load({role:'organiser'});await group();await click(get('iigGroupHelp').querySelector('button'))};
document.querySelector('#player').onclick=async()=>{await load({role:'player'});await group();await click(get('iigGroupHelp').querySelector('button'))};
</script></html>
