<!doctype html><html lang="en"><meta charset="utf-8"><title>Organiser onboarding checks</title><style>body{font:15px system-ui;background:#f5f8f5;margin:24px}iframe{height:844px;border:1px solid #ccc;background:white}pre{white-space:pre-wrap}button{padding:10px}</style><h1>Organiser onboarding checks</h1><p id="status">Running isolated integration checks…</p><pre id="results"></pre><iframe id="app" title="Test app" width="390"></iframe><script>
const frame=document.querySelector('#app'), output=document.querySelector('#results'), results=[];
const check=(name,ok)=>{if(!ok)throw Error(name);results.push(name);output.textContent=JSON.stringify({passed:results.length,results},null,2)};
const wait=async test=>{const start=Date.now();while(!test()){if(Date.now()-start>5000)throw Error('Timeout: '+String(test));await new Promise(r=>setTimeout(r,15))}};
const win=()=>frame.contentWindow, doc=()=>frame.contentDocument, get=id=>doc().getElementById(id);
const visible=id=>!!get(id)&&get(id).getClientRects().length>0;
const fill=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new Event('input',{bubbles:true}));get(id).dispatchEvent(new Event('change',{bubbles:true}))};

async function freshGroup(){await load();await start();await verify();await wait(()=>visible('onboardingInvite'))}

(async()=>{
await load();await layout(1);
check('Exactly four onboarding steps',doc().querySelectorAll('.onboarding-steps li').length===4);
fill('regName','Preview Organiser');fill('regSetupEmail','preview@example.com');fill('regGroupName','Sunday Golfers');get('regGroupForm').requestSubmit();await new Promise(r=>setTimeout(r,40));check('Handicap required before email code',!visible('regCode'));
fill('regSetupHandicap','61');get('regGroupForm').requestSubmit();await new Promise(r=>setTimeout(r,40));check('Out-of-range handicap rejected before email code',!visible('regCode'));
await start();check('OTP remains step 1',get('regProgress').textContent==='Step 1 of 4');await verify('000000');check('Wrong OTP creates no group',win().IIGPreview.data.group===null);check('Existing OTP error retained',get('regMessage').textContent.includes('incorrect or has expired'));await verify();check('Exactly one create request',win().IIGPreview.calls.filter(x=>x.path.endsWith('/iig_create_owned_playing_group')).length===1);check('Organiser automatically linked to one player',win().IIGPreview.data.group.state.players.length===1&&win().IIGPreview.data.group.player_id===win().IIGPreview.data.group.state.players[0].id);check('Name and handicap carried into player profile',win().IIGPreview.data.group.state.players[0].name==='Preview Organiser'&&win().IIGPreview.data.group.state.players[0].handicap===11.2);check('No separate player join action needed',!win().IIGPreview.calls.some(x=>x.path.endsWith('/iig_join_release_group')));await layout(2);
Object.defineProperty(win().navigator,'clipboard',{value:{writeText:async()=>{throw Error('unavailable')}},configurable:true});await click('onboardingInvite');check('Clipboard failure shows selectable invitation',visible('onboardingInvitation'));check('Private invitation token retained',get('onboardingInvitation').value.includes('#pin=4827&invite=22222222-2222-4222-8222-222222222222'));await click('onboardingInviteNext');await layout(3);
await load(null,'',false);await wait(()=>visible('onboardingPaymentForm'));check('Reload resumes optional payment step',get('regProgress').textContent==='Step 3 of 4');
fill('onboardingPaymentLink','http://monzo.me/preview');get('onboardingPaymentForm').requestSubmit();await new Promise(r=>setTimeout(r,40));check('Insecure link rejected',visible('onboardingPaymentForm')&&get('regMessage').textContent.includes('https://'));check('Invalid link sends no write',!win().IIGPreview.calls.some(x=>x.path.endsWith('/iig_operate_owned_group')));
fill('onboardingPaymentLink','https://paypal.me/preview');get('onboardingPaymentForm').requestSubmit();await new Promise(r=>setTimeout(r,40));check('Payment app mismatch rejected',get('regMessage').textContent.includes('PayPal'));
fill('onboardingPaymentLink','https://monzo.me/preview');win().IIGPreview.fail('/rest/v1/rpc/iig_operate_owned_group','Connection failed');get('onboardingPaymentForm').requestSubmit();await new Promise(r=>setTimeout(r,40));check('Failed save does not advance',visible('onboardingPaymentForm'));check('Failed save retains typed link',get('onboardingPaymentLink').value==='https://monzo.me/preview');
const amended=win().IIGPreview.data.group;amended.state={...group.state,groupName:'Sunday Golfers',players:amended.state.players};amended.revision=3;win().IIGPreview.setGroup(amended);get('onboardingPaymentForm').requestSubmit();await wait(()=>visible('onboardingOpen'));const saved=win().IIGPreview.data.group;for(const [key,value] of Object.entries(amended.state))check('Payment save preserves '+key,JSON.stringify(saved.state[key])===JSON.stringify(value));check('Saved link verified by readback',saved.revision===4&&saved.state.paymentLink==='https://monzo.me/preview');const saveCall=win().IIGPreview.calls.filter(x=>x.path.endsWith('/iig_operate_owned_group')).at(-1);check('Save uses fresh revision / settings operation',saveCall.body.p_revision===3&&saveCall.body.p_operation==='settings');await layout(4);
win().IIGPreview.fail('/rest/v1/rpc/get_group_access_status','Try again');await click('onboardingOpen');check('Failed group open stays retryable',visible('onboardingOpen')&&get('welcomeStartTitle').textContent==='You’re ready to go');await click('onboardingOpen');check('Full organiser app opens',!visible('setupOverlay')&&visible('nround'));await wait(()=>!!get('simplerAdminSettings'));await new Promise(r=>requestAnimationFrame(r));await click('nplayers');check('Organiser appears in Players as their own profile',get('screen').textContent.includes('Preview Organiser · You'));check('Completed marker cleared',!sessionStorage.getItem('iig-organiser-setup-v1-'+user.id));await load(null,'',false);await wait(()=>visible('regOpenGroup')||!visible('setupOverlay'));check('Returning organiser has no onboarding',!visible('organiserOnboarding')&&doc().querySelector('.onboarding-steps').getClientRects().length===0);
await load();fill('regName','Scratch Organiser');fill('regSetupEmail','preview@example.com');fill('regGroupName','Scratch Golfers');fill('regSetupHandicap','0');await click('regCreate');await wait(()=>visible('regCode'));await load(null,'',false);check('Zero handicap survives draft reload',get('regSetupHandicap').value==='0');await start();await verify();await wait(()=>visible('onboardingInvite'));await click('onboardingInviteLater');await click('onboardingPaymentLater');check('Both optional steps can be skipped',visible('onboardingOpen'));check('Skip does not save payment settings',!win().IIGPreview.calls.some(x=>x.path.endsWith('/iig_operate_owned_group')));
await load({session,group});await wait(()=>visible('regOpenGroup'));check('Existing session bypasses setup',doc().querySelector('.onboarding-steps').getClientRects().length===0);check('Existing group never recreated',!win().IIGPreview.calls.some(x=>x.path.endsWith('/iig_create_owned_playing_group')));
await load({session:null,group});doc().querySelector('.welcome-start').click();await start();await verify();await wait(()=>visible('regOpenGroup'));check('Existing email in Start retains group',get('regCreatedName').textContent==='Existing Golfers'&&doc().querySelector('.onboarding-steps').getClientRects().length===0);check('Existing email sends no create',!win().IIGPreview.calls.some(x=>x.path.endsWith('/iig_create_owned_playing_group')));
await load({session:null,group},'#pin=4827&invite=22222222-2222-4222-8222-222222222222');check('Join route retains email sign-in',visible('regEmailForm')&&!doc().querySelector('.onboarding-steps'));fill('regEmail','preview@example.com');get('regEmailForm').requestSubmit();await wait(()=>visible('regCode'));await verify();await wait(()=>visible('regJoinForm'));check('Joining still asks name and handicap',visible('regPlayerName')&&visible('regHandicap'));check('Joining never creates a group',!win().IIGPreview.calls.some(x=>x.path.endsWith('/iig_create_owned_playing_group')));
await load({session,group},'#admin=1');await wait(()=>!visible('setupOverlay'));check('Admin route opens original app',visible('nround'));
await load();await click('regReturning');check('Returning email and password options preserved',visible('regEmailForm')&&visible('regPasswordOption'));doc().querySelector('#welcomeStart>.welcome-back').click();doc().querySelector('.welcome-join').click();check('Home Join keeps PIN route',visible('pinInput'));
document.querySelector('#status').textContent='PASS — '+results.length+' isolated integration checks';
output.textContent=JSON.stringify({passed:results.length,results,scope:'Simulated backend; real email delivery and LIVE writes not exercised.'},null,2);
})().catch(error=>{document.querySelector('#status').textContent='FAIL — '+error.message;output.textContent+='\n'+error.stack});
</script></html>
