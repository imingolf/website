name: App header updater

on:
  push:
    paths:
      - '.github/workflows/app-header-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply app header patch
        run: python scripts/app_header_patch.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app/index.html; then
            echo "No app changes needed"
            exit 0
          fi
          git config user.name "I'm In Golf"
          git config user.email "actions@users.noreply.github.com"
          git add app/index.html
          git commit -m "Use compact logo header and clear Admin Mode styling"
          git push
